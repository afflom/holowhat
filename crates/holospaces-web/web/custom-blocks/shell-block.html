<div class="shell-wrapper" x-data="shellBlock">
  <!-- Sign-in Screen -->
  <template x-if="!participant">
    <div class="modal-overlay">
      <div class="modal-card">
        <h3>Holo-Apps Platform Identity</h3>
        <p class="desc">A self-sovereign participant identity is required to verify provenance (ADR-001/CC-1).</p>
        <button class="action-btn" @click="generateKeys()">Generate Keys</button>
        <div style="margin: 16px 0; color: #64748b; font-size: 0.8rem;">or load existing</div>
        <input type="text" x-model="importInput" placeholder="Paste Backup Payload (Base64)" style="width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; border: 1px solid rgba(148, 163, 184, 0.2); color: white; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 0.8rem;" />
        <button class="action-btn" style="background: #475569;" @click="importKeys()">Import Identity</button>
      </div>
    </div>
  </template>

  <!-- Active Workspace -->
  <template x-if="participant">
    <div class="workspace-layout">
      <!-- Sidebar -->
      <div class="sidebar-pane">
        <div class="sidebar-hdr">
          <span class="icon">🌀</span>
          <span class="lbl">Holo-Apps Shell</span>
        </div>
        
        <div class="nav-grp">
          <div class="grp-lbl">Navigation</div>
          <div class="nav-item" :class="{ 'active': activeTab === 'dashboard' }" @click="activeTab = 'dashboard'">
            Dashboard
          </div>
          <div class="nav-item" :class="{ 'active': activeTab === 'index' }" @click="activeTab = 'index'">
            App Store Index
          </div>
        </div>

        <div class="nav-grp">
          <div class="grp-lbl">My Channels</div>
          <template x-for="ch in channels">
            <div class="nav-item" :class="{ 'active': activeTab === 'channel' && activeChannel?.id === ch.id }" @click="selectChannel(ch)">
              <span x-text="ch.name"></span>
            </div>
          </template>
          <button class="add-btn" @click="createChannelPrompt()">+ Create Channel</button>
          <button class="add-btn" @click="joinChannelPrompt()">→ Join Channel</button>
        </div>
      </div>

      <!-- Main Panel -->
      <div class="content-pane">
        <!-- Top status bar -->
        <div class="status-bar">
          <span class="title-lbl" x-text="topBarTitle">Dashboard</span>
          <div class="user-pill">
            <div class="green-dot"></div>
            <span class="user-id" x-text="'Operator: ' + participant.id.substring(0, 10) + '...'"></span>
          </div>
        </div>

        <!-- Inner Content Area -->
        <div class="inner-area">
          <!-- Dashboard View -->
          <template x-if="activeTab === 'dashboard'">
            <div class="dashboard-view">
              <div class="info-box">
                <h4>Identity Address (κ)</h4>
                <code x-text="participant.id"></code>
              </div>
              <div class="info-box">
                <h4>ECDH Exchange Address</h4>
                <code x-text="participant.curveId"></code>
              </div>
              <div style="display: flex; gap: 12px; margin-top: 12px;">
                <button class="action-btn" @click="exportIdentity()">Export Backup Payload</button>
                <button class="action-btn" style="background: #ef4444;" @click="clearIdentity()">Logout / Clear</button>
              </div>
            </div>
          </template>

          <!-- Index Store View -->
          <template x-if="activeTab === 'index'">
            <div class="store-grid">
              <template x-for="app in indexApps">
                <div class="store-card">
                  <div class="card-name" x-text="app.name">App Name</div>
                  <div class="card-desc">Coordination-free client-side chat app. All messages are encrypted under rotated epoch keys.</div>
                  <button class="action-btn" @click="installApp(app)" x-text="isInstalled(app.id) ? 'Installed' : 'Install'"></button>
                </div>
              </template>
            </div>
          </template>

          <!-- Active Messenger Channel View -->
          <template x-if="activeTab === 'channel'">
            <div class="messenger-box">
              <messenger-block :channel-id="activeChannel.id"></messenger-block>
            </div>
          </template>
        </div>
      </div>
  </template>
</div>
<script type="module">
  import { Participant, Event, Collection, App, canonicalJson, sha256, HoloAppsCrypto } from "/assets/scripts/holo-apps.js";
  import { messengerReducer, createMessengerApp } from "/assets/scripts/holo-messenger.js";

  export default {
    mixins: [],
    participant: null,
    activeTab: "dashboard",
    channels: [],
    activeChannel: null,
    indexApps: [],
    installedAppIds: [],
    topBarTitle: "Dashboard",
    importInput: "",

    async init() {
      // Restore or generate participant identity
      const savedJwk = localStorage.getItem("holoapps_participant_jwk");
      if (savedJwk) {
        try {
          const jwkObj = JSON.parse(savedJwk);
          this.participant = await Participant.importJwk(jwkObj);
          console.log("Restored shell-block identity:", this.participant.id);
        } catch (e) {
          console.error("Failed to restore shell-block identity:", e);
        }
      }
      
      const mockManifest = await createMessengerApp(this.participant || await Participant.create());
      this.indexApps = [mockManifest];

      this.installedAppIds = JSON.parse(localStorage.getItem("holoapps_installed_apps") || "[]");
      await this.loadChannels();
    },

    async generateKeys() {
      const p = await Participant.create();
      this.participant = p;
      const jwk = await p.exportJwk();
      localStorage.setItem("holoapps_participant_jwk", JSON.stringify(jwk));
      localStorage.setItem("holoapps_identity_key", p.id);
      localStorage.setItem("holoapps_curve_key", p.curveId);
      
      // Update app index list with new participant mapping
      const mockManifest = await createMessengerApp(p);
      this.indexApps = [mockManifest];
    },

    async importKeys() {
      if (!this.importInput) return;
      try {
        const jwkObj = JSON.parse(atob(this.importInput.trim()));
        const p = await Participant.importJwk(jwkObj);
        this.participant = p;
        localStorage.setItem("holoapps_participant_jwk", JSON.stringify(jwkObj));
        localStorage.setItem("holoapps_identity_key", p.id);
        localStorage.setItem("holoapps_curve_key", p.curveId);
        this.importInput = "";
        
        // Update app index list with new participant mapping
        const mockManifest = await createMessengerApp(p);
        this.indexApps = [mockManifest];
        
        alert("Identity imported successfully!");
      } catch (e) {
        console.error(e);
        alert("Failed to import identity. Ensure you pasted a valid Backup Payload.");
      }
    },

    async exportIdentity() {
      try {
        const jwkObj = await this.participant.exportJwk();
        const serialized = btoa(JSON.stringify(jwkObj));
        prompt("Copy this Complete Backup Payload (Base64-encoded JWKs):", serialized);
      } catch (e) {
        console.error(e);
        alert("Failed to export identity.");
      }
    },

    clearIdentity() {
      if (confirm("Are you sure you want to log out and clear your identity from this browser? Make sure you backed up your keys!")) {
        localStorage.removeItem("holoapps_participant_jwk");
        localStorage.removeItem("holoapps_identity_key");
        localStorage.removeItem("holoapps_curve_key");
        this.participant = null;
      }
    },

    async loadChannels() {
      const savedChannels = JSON.parse(localStorage.getItem("holoapps_channels") || "[]");
      this.channels = [];
      for (const ch of savedChannels) {
        const col = new Collection(ch.id, messengerReducer);
        
        const eventIds = JSON.parse(localStorage.getItem(`holoapps_col_events:${ch.id}`) || "[]");
        for (const evId of eventIds) {
          const raw = localStorage.getItem(`holoapps_event:${evId}`);
          if (raw) {
            const evData = JSON.parse(raw);
            const ev = new Event(evData.header, evData.body, evData.signature, evData.id);
            await col.addEvent(ev);
          }
        }
        
        this.channels.push({
          id: ch.id,
          name: ch.name,
          collection: col
        });
      }
    },

    isInstalled(appId) {
      return this.installedAppIds.includes(appId);
    },

    installApp(app) {
      if (!this.isInstalled(app.id)) {
        this.installedAppIds.push(app.id);
        localStorage.setItem("holoapps_installed_apps", JSON.stringify(this.installedAppIds));
      }
    },

    async createChannelPrompt() {
      const name = prompt("Enter Channel Name:");
      if (!name) return;

      const genesis = await Event.create({
        kind: "genesis",
        author: this.participant.id,
        collectionId: "temp-genesis-id",
        payload: { name, timestamp: Date.now() }
      }, this.participant);

      genesis.header.collection = genesis.id;
      const payloadToSign = canonicalJson({ header: genesis.header, body: genesis.body });
      genesis.signature = await HoloAppsCrypto.sign(this.participant.signKeys.privateKey, payloadToSign);
      genesis.id = await sha256(canonicalJson({ header: genesis.header, body: genesis.body, signature: genesis.signature }));

      const col = new Collection(genesis.id, messengerReducer);
      await col.addEvent(genesis);

      this.saveEvent(genesis);
      this.saveChannelRef(genesis.id, name);

      this.channels.push({
        id: genesis.id,
        name: name,
        collection: col
      });
    },

    async joinChannelPrompt() {
      const invite = prompt("Paste Invite Code:");
      if (!invite) return;
      try {
        const payload = JSON.parse(atob(invite.trim()));
        if (payload && payload.id && payload.genesisEvent) {
          const gData = payload.genesisEvent;
          const genesis = new Event(gData.header, gData.body, gData.signature, gData.id);
          
          const col = new Collection(genesis.id, messengerReducer);
          await col.addEvent(genesis);
          this.saveEvent(genesis);
          this.saveChannelRef(genesis.id, payload.name || "Joined Channel");

          if (payload.events) {
            for (const evData of payload.events) {
              const ev = new Event(evData.header, evData.body, evData.signature, evData.id);
              await col.addEvent(ev);
              this.saveEvent(ev);
            }
          }

          // Unwrap and store epoch keys that we have access to
          for (const ev of col.events.values()) {
            if (ev.header.kind === "epoch") {
              await col.unwrapAndStoreEpochKey(ev, this.participant);
            }
          }

          this.channels.push({
            id: genesis.id,
            name: payload.name || "Joined Channel",
            collection: col
          });
        }
      } catch (e) {
        console.error(e);
        alert("Invalid invite payload");
      }
    },

    saveEvent(event) {
      localStorage.setItem(`holoapps_event:${event.id}`, JSON.stringify(event));
      const colId = event.header.collection;
      const eventIds = JSON.parse(localStorage.getItem(`holoapps_col_events:${colId}`) || "[]");
      if (!eventIds.includes(event.id)) {
        eventIds.push(event.id);
        localStorage.setItem(`holoapps_col_events:${colId}`, JSON.stringify(eventIds));
      }
    },

    saveChannelRef(id, name) {
      const saved = JSON.parse(localStorage.getItem("holoapps_channels") || "[]");
      if (!saved.some(c => c.id === id)) {
        saved.push({ id, name });
        localStorage.setItem("holoapps_channels", JSON.stringify(saved));
      }
    },

    selectChannel(ch) {
      this.activeChannel = ch;
      this.activeTab = "channel";
      this.topBarTitle = `Channel: ${ch.name}`;
    }
  }
</script>
