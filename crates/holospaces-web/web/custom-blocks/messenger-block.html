<div class="msg-wrapper" x-data="messengerBlock">
  <!-- Messages List -->
  <div class="messages-list" id="chat-scroller">
    <template x-for="msg in view.messages" :key="msg.id">
      <div class="message" :class="{ 'mine': msg.author === identity }">
        <div class="meta">
          <span class="author" x-text="msg.author === identity ? 'You' : msg.author.substring(0, 8)"></span>
          <span class="time" x-text="new Date(msg.timestamp).toLocaleTimeString()"></span>
          <template x-if="msg.edits.length > 0">
            <span class="edited">(edited)</span>
          </template>
        </div>
        <div class="body" x-text="msg.body"></div>

        <!-- Reactions -->
        <div class="reactions" x-show="msg.reactions.length > 0">
          <template x-for="r in msg.reactions" :key="r.symbol">
            <span class="badge" :class="{ 'active': r.authors.includes(identity) }" @click="toggleReact(msg, r.symbol)" x-text="r.symbol + ' ' + r.count"></span>
          </template>
        </div>

        <!-- Actions -->
        <div class="actions">
          <button @click="toggleReact(msg, '👍')">👍</button>
          <button @click="toggleReact(msg, '❤️')">❤️</button>
          <template x-if="msg.author === identity">
            <button @click="startEdit(msg)">Edit</button>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Input Area -->
  <div class="input-bar">
    <input type="text" class="chat-input" placeholder="Send a message..." x-model="text" @keydown.enter="send()" />
    <button class="send-btn" @click="send()">Send</button>
    <button class="send-btn" style="background: #475569;" @click="invite()">Invite</button>
  </div>

  <!-- Edit Modal -->
  <template x-if="editing">
    <div class="edit-overlay">
      <div class="edit-dialog">
        <h4>Edit Message</h4>
        <input type="text" class="chat-input" x-model="editText" />
        <div class="edit-buttons">
          <button class="send-btn" @click="saveEdit()">Save</button>
          <button class="send-btn cancel" @click="editing = null">Cancel</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script type="module">
  import { Event, canonicalJson, sha256 } from "/assets/scripts/holo-apps.js";

  export default {
    mixins: [],
    props: {
      channelId: String
    },
    identity: "",
    view: { messages: [] },
    text: "",
    editing: null,
    editText: "",

    async init() {
      this.identity = localStorage.getItem("holoapps_identity_key") || "";
      await this.refresh();
      
      this._pollInterval = setInterval(async () => {
        await this.refresh();
      }, 1000);
    },

    destroy() {
      clearInterval(this._pollInterval);
    },

    getCollection() {
      // Find collection inside the shell block active channels
      const shell = Alpine.$data(document.querySelector("shell-block").shadowRoot.querySelector(".shell-wrapper"));
      const ch = shell.channels.find(c => c.id === this.channelId);
      return ch ? ch.collection : null;
    },

    async refresh() {
      const col = this.getCollection();
      if (col) {
        this.view = await col.render();
      }
    },

    async send() {
      if (!this.text) return;
      const col = this.getCollection();
      if (!col) return;

      const shell = Alpine.$data(document.querySelector("shell-block").shadowRoot.querySelector(".shell-wrapper"));
      const p = shell.participant;
      const parents = Array.from(col.heads);
      
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const ev = await Event.create({
        kind: "message",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload: { body: this.text, timestamp: Date.now() }
      }, p);

      const added = await col.addEvent(ev);
      if (added) {
        shell.saveEvent(ev);
        this.text = "";
        await this.refresh();

        this.$nextTick(() => {
          const scroller = this.$el.querySelector("#chat-scroller");
          if (scroller) scroller.scrollTop = scroller.scrollHeight;
        });
      }
    },

    async toggleReact(msg, symbol) {
      const col = this.getCollection();
      if (!col) return;

      const shell = Alpine.$data(document.querySelector("shell-block").shadowRoot.querySelector(".shell-wrapper"));
      const p = shell.participant;
      const parents = Array.from(col.heads);
      
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const ev = await Event.create({
        kind: "reaction",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload: { target: msg.id, symbol }
      }, p);

      const added = await col.addEvent(ev);
      if (added) {
        shell.saveEvent(ev);
        await this.refresh();
      }
    },

    startEdit(msg) {
      this.editing = msg;
      this.editText = msg.body;
    },

    async saveEdit() {
      if (!this.editing) return;
      const col = this.getCollection();
      if (!col) return;

      const shell = Alpine.$data(document.querySelector("shell-block").shadowRoot.querySelector(".shell-wrapper"));
      const p = shell.participant;
      const parents = Array.from(col.heads);
      
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const ev = await Event.create({
        kind: "edit",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload: { target: this.editing.id, body: this.editText }
      }, p);

      const added = await col.addEvent(ev);
      if (added) {
        shell.saveEvent(ev);
        await this.refresh();
        this.editing = null;
      }
    },

    async invite() {
      const targetId = prompt("Enter Invitee's Identity Address (κ):");
      if (!targetId) return;
      const targetCurveId = prompt("Enter Invitee's ECDH Public Exchange Key:");
      if (!targetCurveId) return;

      const col = this.getCollection();
      if (!col) return;

      const shell = Alpine.$data(document.querySelector("shell-block").shadowRoot.querySelector(".shell-wrapper"));
      const p = shell.participant;

      // 1. Author a membership grant event
      const parents = Array.from(col.heads);
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const grantEvent = await Event.create({
        kind: "membership",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload: {
          target: targetId,
          action: "grant",
          capabilities: ["read", "write"],
          curveId: targetCurveId
        }
      }, p);

      const grantAdded = await col.addEvent(grantEvent);
      if (!grantAdded) {
        alert("Failed to grant membership. Are you an admin of this channel?");
        return;
      }
      shell.saveEvent(grantEvent);

      // 2. Generate and wrap a new/existing epoch key
      let epochKey = col.epochKeys.get(col.currentEpochId);
      if (!epochKey) {
        epochKey = await HoloAppsCrypto.generateEpochKey();
      }

      // Wrap for both target and self (for forward access)
      const myWrappedKey = await HoloAppsCrypto.wrapEpochKey(epochKey, p.curveKeys.privateKey, p.curveId);
      const targetWrappedKey = await HoloAppsCrypto.wrapEpochKey(epochKey, p.curveKeys.privateKey, targetCurveId);

      const epochParents = Array.from(col.heads);
      let epochMaxClock = 0;
      for (const pId of epochParents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > epochMaxClock) epochMaxClock = parent.header.clock;
      }

      const epochEvent = await Event.create({
        kind: "epoch",
        author: p.id,
        collectionId: col.id,
        parents: epochParents,
        clock: epochMaxClock + 1,
        payload: {
          senderCurveId: p.curveId,
          wrappedKeys: {
            [p.id]: myWrappedKey,
            [targetId]: targetWrappedKey
          }
        }
      }, p);

      const epochAdded = await col.addEvent(epochEvent);
      if (!epochAdded) {
        alert("Failed to add epoch key rotation event.");
        return;
      }
      shell.saveEvent(epochEvent);
      col.epochKeys.set(epochEvent.id, epochKey);
      col.currentEpochId = epochEvent.id;

      // 3. Serialize invite payload
      const allEvents = Array.from(col.events.values()).map(ev => ({
        header: ev.header,
        body: ev.body,
        signature: ev.signature,
        id: ev.id
      }));

      const genesisEvent = allEvents.find(e => e.header.kind === "genesis");
      const ch = shell.channels.find(c => c.id === col.id);
      const channelName = ch ? ch.name : "Joined Channel";

      const inviteObj = {
        id: col.id,
        name: channelName,
        genesisEvent,
        events: allEvents.filter(e => e.header.kind !== "genesis")
      };

      const serialized = btoa(JSON.stringify(inviteObj));
      prompt("Share this Invite Code with the invitee:", serialized);
    }
  }
</script>
