<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holo-Apps WebOS Control Panel</title>
    <link href="/assets/css/reset.css" rel="stylesheet" />
    <link href="/assets/css/apps.css" rel="stylesheet" />
    <link rel="icon" href="/assets/img/globe-alt.svg" sizes="any" type="image/svg+xml" />
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.95); }
      }
      @keyframes soundwave {
        0%, 100% { height: 8px; }
        50% { height: 40px; }
      }
      .simulated-waveform .bar {
        width: 6px;
        background: var(--accent);
        border-radius: 3px;
      }
      .animate-bar-1 { animation: soundwave 1s ease-in-out infinite; }
      .animate-bar-2 { animation: soundwave 0.8s ease-in-out infinite; }
      .animate-bar-3 { animation: soundwave 1.2s ease-in-out infinite; }
      .animate-bar-4 { animation: soundwave 0.6s ease-in-out infinite; }
    </style>
    
    <script type="module" src="/assets/scripts/holo-apps.js"></script>
    <script type="module" src="/assets/scripts/holo-messenger.js"></script>
    <script type="module" src="/assets/scripts/apps.js"></script>
  </head>
  <body x-data="shell">
    
    <!-- Sign-In / Identity Verification Overlay -->
    <template x-if="!participant">
      <div class="overlay">
        <div class="dialog glass">
          <h2>User Account Sign-In</h2>
          <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4;">
            Sign in to access your workspaces and secure communication channels.
          </p>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" class="input" placeholder="Display Nickname (e.g. Alice)" x-model="nicknameInput" />
            <button class="btn" @click="createNewIdentity()">
              Create New User Profile
            </button>
            <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">or load existing</div>
            <input type="text" class="input" placeholder="Paste Account Backup Payload" x-model="privateKeyHexInput" />
            <button class="btn btn-secondary" @click="loadExistingIdentity()" :disabled="!privateKeyHexInput">
              Import Profile
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Main Shell App View -->
    <template x-if="participant">
      <div class="shell-container">
        
        <!-- Sidebar Navigation Tree -->
        <div class="sidebar">
          <div class="sidebar-header">
            <div class="logo-glow"></div>
            <img class="logo-img" src="/assets/img/globe-alt.svg" />
            <div class="sidebar-title">Holo-Apps OS</div>
          </div>
          
          <div class="sidebar-section">
            <!-- App Navigation -->
            <div class="section-label">System Control Panel</div>
            <ul class="sidebar-list">
              <li class="sidebar-item" :class="{ 'active': activeTab === 'dashboard' }" @click="selectTab('dashboard')">
                <span>Workspace Dashboard</span>
              </li>
              <li class="sidebar-item" :class="{ 'active': activeTab === 'apps' }" @click="selectTab('apps')">
                <span>Index App Store</span>
              </li>
              <li class="sidebar-item" :class="{ 'active': activeTab === 'contacts' }" @click="activeTab = 'contacts'; activeChannel = null; topBarTitle = 'Contacts & Pools Directory'">
                <span>Contacts & Pools</span>
              </li>
            </ul>

            <!-- Workspaces (AS2 Group) -->
            <div class="section-label">Workspaces</div>
            <ul class="sidebar-list">
              <template x-for="ws in workspaces" :key="ws.id">
                <li class="sidebar-item" :class="{ 'active': activeWorkspace?.id === ws.id }" @click="selectWorkspace(ws)">
                  <span x-text="ws.name">Workspace Name</span>
                  <span class="sidebar-item-meta" x-text="ws.id.substring(0, 6)">ID</span>
                </li>
              </template>
            </ul>
            <div style="display: flex; gap: 8px; padding: 0 8px; margin-bottom: 16px;">
              <button class="btn btn-secondary" @click="showCreateWorkspaceModal = true" style="font-size: 0.75rem; padding: 6px 8px; flex: 1;">
                + Create WS
              </button>
              <button class="btn btn-secondary" @click="showJoinWorkspaceModal = true" style="font-size: 0.75rem; padding: 6px 8px; flex: 1;">
                → Join WS
              </button>
            </div>

            <!-- Active Workspace Streams -->
            <template x-if="activeWorkspace">
              <div>
                <div class="section-label" x-text="activeWorkspace.name + ' Streams'">Workspace Streams</div>
                <ul class="sidebar-list">
                  
                  <!-- Messages App Stream (if installed) -->
                  <template x-if="isAppInstalled('holo-messenger')">
                    <li>
                      <div class="sidebar-item" :class="{ 'active': activeTab === 'messages_home' }" @click="activeTab = 'messages_home'; activeChannel = null; topBarTitle = 'Messages App'" style="display: flex; align-items: center; justify-content: space-between;">
                        <span>💬 Messages</span>
                      </div>
                      <!-- Nested channels list -->
                      <ul style="padding-left: 16px; margin: 4px 0 8px 0; border-left: 1px dashed var(--border); display: flex; flex-direction: column; gap: 4px;">
                        <template x-for="ch in channels" :key="ch.id">
                          <li class="sidebar-item" :class="{ 'active': activeTab === 'channel' && activeChannel?.id === ch.id }" @click="selectChannel(ch)" style="font-size: 0.8rem; padding: 4px 8px; border-radius: 4px;">
                            <span x-text="'# ' + ch.name">Channel Name</span>
                          </li>
                        </template>
                        <li style="padding: 4px 8px; display: flex; gap: 4px;">
                          <button class="btn btn-secondary" @click="showCreateChannelModal = true" style="font-size: 0.65rem; padding: 4px 6px; flex: 1; border-style: dashed;">
                            + Channel
                          </button>
                        </li>
                      </ul>
                    </li>
                  </template>

                  <!-- Calendar App Stream (if installed) -->
                  <template x-if="isAppInstalled('holo-calendar')">
                    <li class="sidebar-item" :class="{ 'active': activeTab === 'calendar' }" @click="activeTab = 'calendar'; activeChannel = null; topBarTitle = 'Shared Calendar'">
                      <span>📅 Calendar</span>
                    </li>
                  </template>

                  <!-- Multi-media App Stream (if installed) -->
                  <template x-if="isAppInstalled('holo-multimedia')">
                    <li class="sidebar-item" :class="{ 'active': activeTab === 'multimedia' }" @click="activeTab = 'multimedia'; activeChannel = null; topBarTitle = 'Shared Media Library'">
                      <span>📂 Multi-media</span>
                    </li>
                  </template>

                  <!-- Calling App Stream (if installed) -->
                  <template x-if="isAppInstalled('holo-calling')">
                    <li class="sidebar-item" :class="{ 'active': activeTab === 'calling' }" @click="activeTab = 'calling'; activeChannel = null; topBarTitle = 'P2P Voice & Video Calling'">
                      <span>📞 Calling</span>
                    </li>
                  </template>

                </ul>
                
                <div style="display: flex; gap: 8px; padding: 0 8px; margin-top: 12px;">
                  <button class="btn btn-secondary" @click="addMemberToActiveWorkspace()" style="font-size: 0.75rem; padding: 6px 8px; flex: 1;">
                    + Member
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Main Display Panel -->
        <div class="main-content">
          <div class="top-bar">
            <div>
              <h2 style="font-size: 1.2rem; font-weight: 600;" x-text="topBarTitle">Workspace</h2>
            </div>
            
            <div class="user-badge" @click="showIdentityDetails = true" x-show="participant">
              <div class="status-dot"></div>
              <span class="pubkey-abbr" x-text="'User: ' + (participant ? participant.id.substring(0, 12) : '') + '...'">Address</span>
            </div>
          </div>
          
          <div class="content-pane">
            
            <!-- Dashboard Tab (Non-Scrolling Control Panel) -->
            <template x-if="activeTab === 'dashboard'">
              <div style="display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; height: 100%; overflow: hidden;">
                
                <h3 style="font-size: 1.25rem; font-weight: 700; color: white; margin: 0;">User Account & Security</h3>
                
                <!-- User ID Card (Human-Centered) -->
                <div class="user-id-card" style="margin-bottom: 0; flex-shrink: 0;">
                  <svg class="avatar-svg" viewBox="0 0 100 100" x-html="generateAvatarSvg(participant ? participant.id : '')"></svg>
                  <div class="card-details">
                    <div class="card-nickname" x-text="localStorage.getItem('holoapps_nickname') || 'Operator'"></div>
                    <div class="card-holo-id" @click="copyHoloId()" title="Click to copy your unified Holo ID">
                      <span style="font-weight: 600; color: var(--accent);">Your Holo ID:</span>
                      <span x-text="getHoloId()" style="opacity: 0.85;"></span>
                    </div>
                  </div>
                  <button class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;" @click="showIdentityDetails = true">Config</button>
                </div>
                
                <!-- OS Control Center Grid (2x2 proportioned to screen) -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex-grow: 1; min-height: 0;">
                  
                  <!-- Workspace Control -->
                  <div class="widget-card glass" style="justify-content: space-between; padding: 20px;">
                    <div>
                      <div class="widget-header">🗂️ Workspace Manager</div>
                      <div class="widget-value" style="font-family: inherit; font-size: 1.25rem; word-break: break-all; margin-top: 8px;" x-text="activeWorkspace ? activeWorkspace.name : 'No Workspace Active'"></div>
                      <div style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;" x-text="activeWorkspace ? (activeWorkspace.members.length + ' members • ' + activeWorkspace.channels.length + ' channels') : 'Connect to a workspace to start collaboration'"></div>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 12px; font-size: 0.82rem;" @click="showWorkspaceManageModal = true" :disabled="!activeWorkspace">
                      Manage Workspace
                    </button>
                  </div>

                  <!-- Network / WebRTC Swarm -->
                  <div class="widget-card glass" style="justify-content: space-between; padding: 20px;">
                    <div>
                      <div class="widget-header">🌐 Network Status</div>
                      <div class="widget-value" :style="{ color: isWebRtcConnected ? 'var(--success)' : 'var(--error)' }" x-text="isWebRtcConnected ? 'Connected & Online' : 'Offline / Disconnected'" style="font-family: inherit; font-size: 1.25rem; margin-top: 8px;">Offline / Disconnected</div>
                      <div style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;" x-text="isWebRtcConnected ? 'Exchanging causal ledger events in real-time' : 'Configure WebRTC link signaling to sync'"></div>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 12px; font-size: 0.82rem;" @click="showWebRtcModal = true">
                      Swarm Status
                    </button>
                  </div>

                  <!-- Security & Keys -->
                  <div class="widget-card glass" style="justify-content: space-between; padding: 20px;">
                    <div>
                      <div class="widget-header">🛡️ Security Keys</div>
                      <div class="widget-value" style="font-family: inherit; font-size: 1.25rem; margin-top: 8px; color: #38bdf8;">ECDSA & ECDH P-256</div>
                      <div style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">Cryptographic signing ID & message encryption keys</div>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 12px; font-size: 0.82rem;" @click="showSecurityKeysModal = true">
                      View Account Keys
                    </button>
                  </div>

                  <!-- diagnostics / logs / backups -->
                  <div class="widget-card glass" style="justify-content: space-between; padding: 20px;">
                    <div>
                      <div class="widget-header">🖥️ System Diagnostics</div>
                      <div class="widget-value" style="font-family: inherit; font-size: 1.25rem; margin-top: 8px; color: #c084fc;">OS & Ledger Diagnostics</div>
                      <div style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">Kernel logs, event terminal, recovery & local backups</div>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 12px; font-size: 0.82rem;" @click="showDiagnosticsModal = true">
                      Diagnostics Console
                    </button>
                  </div>

                </div>

              </div>
            </template>

            <!-- App Store / Index Tab -->
            <template x-if="activeTab === 'apps'">
              <div style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                  <h3 style="font-weight: 600; margin-bottom: 12px; text-align: left;">Gateway App Index (Official System Services)</h3>
                  
                  <!-- FreeDesktop.org Desktop Entry Metadata Card -->
                  <div class="settings-section-card" style="margin-bottom: 20px; text-align: left;">
                    <div class="settings-card-header">
                      <span>📁 FreeDesktop.org App Launch Manifests</span>
                    </div>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4;">
                      Applications installed in the active workspace run directly in your browser. All configuration settings are managed securely within your workspace profile.
                    </p>
                    <div style="margin-top: 10px; font-weight: 600; font-size: 0.85rem; color: var(--accent);" x-text="activeWorkspace ? 'Target Workspace: ' + activeWorkspace.name : '⚠️ Please select a workspace to install apps.'"></div>
                  </div>

                  <div class="apps-grid">
                    <template x-for="app in indexApps" :key="app.id">
                      <div class="app-card glass" style="text-align: left;">
                        <div class="app-card-title" x-text="app.name">App Name</div>
                        <div class="app-card-desc" x-text="app.name === 'Messages' ? 'Secure peer-to-peer real-time text chat channels within your workspace context.' : (app.name === 'Calendar' ? 'Coordinate schedules, events, and milestones collaboratively with other workspace members.' : (app.name === 'Multi-media' ? 'Store, preview, and organize videos, images, slides, and documents in a shared workspace library.' : 'Initiate voice and video call streams directly over secure peer-to-peer WebRTC connections.'))">
                          Fast client-side chat application with secure message encryption.
                        </div>
                        <div class="app-card-meta">
                          App ID: <span x-text="app.id.substring(0, 16) + '...'"></span>
                        </div>
                        <div style="display: flex; gap: 8px; margin-top: auto;">
                          <template x-if="!isAppInstalled(app.id)">
                            <button class="btn" @click="installIndexApp(app)" :disabled="!activeWorkspace">Install App</button>
                          </template>
                          <template x-if="isAppInstalled(app.id)">
                            <button class="btn btn-success" style="cursor: not-allowed; opacity: 0.7;" disabled>Installed</button>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Decentralized Workspace Apps Registry (Contributed Shared Apps) -->
                <div style="margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 24px; text-align: left;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div>
                      <h3 style="font-weight: 600; margin: 0;">Shared Holo-Apps Registry</h3>
                      <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Contributed applications discovered in this workspace.</div>
                    </div>
                    <button class="btn" style="font-size: 0.85rem; background: var(--accent);" @click="activeTab = 'multimedia'; showAddMediaModal = true; newMediaItemType = 'application/x-holo-app'">+ Contribute App Bundle</button>
                  </div>

                  <div class="apps-grid">
                    <template x-for="app in workspaceSharedApps" :key="app.id">
                      <div class="app-card glass" style="border-color: rgba(167, 139, 250, 0.4); display: flex; flex-direction: column;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                          <span style="font-size: 1.5rem;">⚙️</span>
                          <span :style="{
                            fontSize: '0.62rem', padding: '2px 6px', borderRadius: '4px',
                            background: app.privacy === 'private' ? 'rgba(239,68,68,0.15)' : (app.privacy === 'workspace' ? 'rgba(99,102,241,0.15)' : 'rgba(16,185,129,0.15)'),
                            border: app.privacy === 'private' ? '1px solid #ef4444' : (app.privacy === 'workspace' ? '1px solid #6366f1' : '1px solid #10b981'),
                            color: app.privacy === 'private' ? '#f87171' : (app.privacy === 'workspace' ? '#818cf8' : '#34d399')
                          }" x-text="app.privacy === 'private' ? '🔒 Private' : (app.privacy === 'workspace' ? '👥 Workspace' : '🌐 Swarm')">Scope</span>
                        </div>
                        
                        <div class="app-card-title" style="margin-top: 8px;" x-text="app.name">App Name</div>
                        <div class="app-card-desc" x-text="app.summary">Description</div>
                        
                        <div class="app-card-meta" style="margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border);">
                          <div>Bundle Hash: <span style="font-family: monospace;" x-text="app.id.substring(0, 16) + '...'"></span></div>
                          <div style="margin-top: 2px;">Creator: <span x-text="app.author.substring(0, 10) + '...'"></span></div>
                        </div>

                        <div style="display: flex; gap: 8px; margin-top: 12px;">
                          <button class="btn" style="background: #6d28d9; border: none; flex: 1;" @click="launchUserlandApp(app)">Launch Application</button>
                        </div>
                      </div>
                    </template>

                    <div x-show="workspaceSharedApps.length === 0" style="grid-column: 1 / -1; color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 30px; border: 1px dashed var(--border); border-radius: 8px;">
                      No custom userland apps shared in this workspace registry yet. Click "+ Contribute App Bundle" to share one.
                    </div>
                  </div>
                </div>

              </div>
            </template>

            <!-- Contacts & Pools Tab -->
            <template x-if="activeTab === 'contacts'">
              <div style="display: flex; gap: 24px; width: 100%; height: 100%;">
                
                <!-- Left Pools Selector Pane -->
                <div class="glass" style="width: 250px; padding: 20px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px;">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--text-secondary);">Contact Pools</h4>
                    <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 0.8rem;" @click="showCreatePoolModal = true">+</button>
                  </div>
                  
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <div 
                      class="sidebar-item" 
                      :class="{ 'active': selectedPoolId === 'all' }" 
                      @click="selectedPoolId = 'all'"
                      style="display: flex; justify-content: space-between; align-items: center;"
                    >
                      <span>Show All</span>
                      <span class="sidebar-item-meta" x-text="contacts.length">0</span>
                    </div>
                    <template x-for="pool in contactPools" :key="pool.id">
                      <div 
                        class="sidebar-item" 
                        :class="{ 'active': selectedPoolId === pool.id }" 
                        @click="selectedPoolId = pool.id"
                        style="display: flex; justify-content: space-between; align-items: center;"
                      >
                        <span x-text="pool.name">Pool Name</span>
                        <span class="sidebar-item-meta" x-text="contacts.filter(c => c.pools?.includes(pool.id)).length">0</span>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Right Directory Contacts list -->
                <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px;">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 1.25rem; font-weight: 700;">Contacts Directory (ActivityStreams Person)</h3>
                    <button class="btn" @click="showAddContactModal = true">+ Add Contact Manually</button>
                  </div>
                  
                  <!-- Network Discoverability Toggle -->
                  <div class="glass" style="padding: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); margin-bottom: 8px;">
                    <div>
                      <strong style="color: white; font-size: 0.95rem; display: block;">🌐 Network Discoverability Space</strong>
                      <span style="font-size: 0.8rem; color: var(--text-muted);">Allow other nodes to discover your profile over the decentralized swarm.</span>
                    </div>
                    <label class="switch" style="position: relative; display: inline-block; width: 44px; height: 22px;">
                      <input type="checkbox" :checked="isDiscoverable" @change="toggleDiscoverable()" style="opacity: 0; width: 0; height: 0;" />
                      <span class="slider" :style="{
                        position: 'absolute', cursor: 'pointer', top: 0, left: 0, right: 0, bottom: 0,
                        backgroundColor: isDiscoverable ? 'var(--success)' : 'rgba(255,255,255,0.1)',
                        transition: '.4s', borderRadius: '22px',
                        boxShadow: isDiscoverable ? '0 0 8px var(--success)' : 'none'
                      }">
                        <span class="knob" :style="{
                          position: 'absolute', content: '', height: '14px', width: '14px', left: isDiscoverable ? '24px' : '4px', bottom: '4px',
                          backgroundColor: 'white', transition: '.4s', borderRadius: '50%'
                        }"></span>
                      </span>
                    </label>
                  </div>

                  <!-- Incoming Friend Requests Section -->
                  <div class="friend-requests-section" x-show="friendRequests.length > 0" style="margin-bottom: 12px; padding: 16px; background: rgba(99, 102, 241, 0.05); border: 1px dashed var(--accent); border-radius: 8px;">
                    <h4 style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--accent); margin: 0 0 12px 0;">Incoming Friend Requests</h4>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                      <template x-for="req in friendRequests" :key="req.senderId">
                        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px;">
                          <div style="display: flex; align-items: center; gap: 10px;">
                            <svg class="avatar-svg" style="width: 32px; height: 32px;" viewBox="0 0 100 100" x-html="generateAvatarSvg(req.senderId)"></svg>
                            <div>
                              <strong x-text="req.senderName" style="color: white; font-size: 0.9rem;"></strong>
                              <span style="color: var(--text-muted); font-size: 0.72rem; display: block; font-family: monospace;" x-text="'κ: ' + req.senderId.substring(0, 16) + '...'"></span>
                            </div>
                          </div>
                          <div style="display: flex; gap: 8px;">
                            <button class="btn btn-success" style="font-size: 0.75rem; padding: 4px 10px;" @click="acceptFriendRequest(req)">Accept</button>
                            <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px 10px; background: var(--error); border-color: var(--error);" @click="declineFriendRequest(req)">Decline</button>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>

                  <!-- Online Peers Nearby Discovery section (Human-Centered) -->
                  <div class="nearby-peers-section">
                    <h4 style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                      <div class="status-dot" :style="{ background: isWebRtcConnected ? 'var(--success)' : 'var(--error)', boxShadow: isWebRtcConnected ? '0 0 8px var(--success)' : '0 0 8px var(--error)' }"></div>
                      <span x-text="isWebRtcConnected ? 'Online Discoverable Peers' : 'Nearby Peers (Offline)'">Online Discoverable Peers</span>
                    </h4>
                    
                    <div class="peer-list" x-show="discoveredPeers.filter(p => !contacts.some(c => c.id === p.id)).length > 0">
                      <template x-for="peer in discoveredPeers.filter(p => !contacts.some(c => c.id === p.id))" :key="peer.id">
                        <div class="peer-item" style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; margin-bottom: 8px;">
                          <div class="peer-info" style="display: flex; align-items: center; gap: 10px;">
                            <svg class="avatar-svg" style="width: 32px; height: 32px;" viewBox="0 0 100 100" x-html="generateAvatarSvg(peer.id)"></svg>
                            <div>

                          <span style="font-size: 0.85rem; text-transform: capitalize; font-weight: 600;" :style="{ color: (activeCallSession || outboundCallState).status === 'connected' ? 'var(--success)' : 'var(--accent)' }" x-text="(activeCallSession || outboundCallState).status">Dialing</span>
                        </div>
                      </div>

                      <div style="height: 120px; display: flex; align-items: center; justify-content: center; width: 100%;">
                        <template x-if="(activeCallSession || outboundCallState).status === 'dialing'">
                          <div style="color: var(--accent); font-size: 0.9rem; font-weight: 500; animation: pulse 1s infinite;">Ringing...</div>
                        </template>
                        <template x-if="(activeCallSession || outboundCallState).status === 'connected'">
                          <div class="simulated-waveform" style="display: flex; gap: 4px; align-items: center; height: 50px;">
                            <div class="bar animate-bar-1"></div>
                            <div class="bar animate-bar-2"></div>
                            <div class="bar animate-bar-3"></div>
                            <div class="bar animate-bar-4"></div>
                            <div class="bar animate-bar-2"></div>
                            <div class="bar animate-bar-1"></div>
                          </div>
                        </template>
                      </div>

                      <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
                        <template x-if="(activeCallSession || outboundCallState).status === 'dialing' && (activeCallSession || outboundCallState).role === 'caller'">
                          <button class="btn" style="background: var(--error);" @click="endCall((activeCallSession || outboundCallState).id)">Cancel Dial</button>
                        </template>

                        <template x-if="(activeCallSession || outboundCallState).status === 'connected'">
                          <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 12px;">
                              <button class="btn btn-secondary" style="border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; padding: 0;">🎙️</button>

                            </div>
                            <button class="btn" style="background: var(--error);" @click="endCall((activeCallSession || outboundCallState).id)">Hang Up</button>
                          </div>
                        </template>
                      </div>

                    </div>
                  </template>

                </div>
              </div>
            </template>

          </div>
        </div>

      </div>

    <!-- P2P WebRTC Connection Modal -->
    <template x-if="showWebRtcModal">
      <div class="overlay">
        <div class="dialog glass" style="max-width: 600px; width: 100%;">
          <h2>P2P WebRTC Connection Link</h2>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <p style="color: var(--text-secondary); font-size: 0.85rem; line-height: 1.4;">
              Establish a direct, serverless peer-to-peer WebRTC connection with another peer to sync updates in real-time.
            </p>
            
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
              <button class="btn" :class="{ 'btn-secondary': webrtcRole !== 'initiate' }" @click="webrtcRole = 'initiate'" style="flex: 1;">A: Initiate (Offerer)</button>
              <button class="btn" :class="{ 'btn-secondary': webrtcRole !== 'receive' }" @click="webrtcRole = 'receive'" style="flex: 1;">B: Accept (Answerer)</button>
            </div>
            
            <template x-if="webrtcRole === 'initiate'">
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn" @click="generateOffer()">1. Generate Offer Connection Code</button>
                
                <template x-if="webrtcOfferCode">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Share this Offer Code with your peer:</label>
                    <textarea class="input" style="height: 100px; font-family: monospace; font-size: 0.75rem;" readonly x-text="webrtcOfferCode" onclick="this.select()"></textarea>
                    <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px;" @click="navigator.clipboard.writeText(webrtcOfferCode); alert('Offer Code copied to clipboard!')">Copy Offer Code</button>
                  </div>
                </template>
                
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px;">
                  <label style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;">2. Paste Answer Code from your peer:</label>
                  <textarea class="input" style="height: 80px; font-family: monospace; font-size: 0.75rem;" placeholder="Paste Answer Code here..." x-model="webrtcAnswerCodeInput"></textarea>
                  <button class="btn" @click="completeConnection()" :disabled="!webrtcAnswerCodeInput">Connect Peer</button>
                </div>
              </div>
            </template>
            
            <template x-if="webrtcRole === 'receive'">
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <label style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;">1. Paste Offer Code from peer:</label>
                  <textarea class="input" style="height: 80px; font-family: monospace; font-size: 0.75rem;" placeholder="Paste Offer Code here..." x-model="webrtcOfferCodeInput"></textarea>
                  <button class="btn" @click="generateAnswer()" :disabled="!webrtcOfferCodeInput">2. Generate Answer Connection Code</button>
                </div>
                
                <template x-if="webrtcAnswerCode">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Share this Answer Code with your peer to open the link:</label>
                    <textarea class="input" style="height: 100px; font-family: monospace; font-size: 0.75rem;" readonly x-text="webrtcAnswerCode" onclick="this.select()"></textarea>
                    <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px;" @click="navigator.clipboard.writeText(webrtcAnswerCode); alert('Answer Code copied to clipboard!')">Copy Answer Code</button>
                  </div>
                </template>
              </div>
            </template>
            
            <div style="display: flex; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px;">
              <button class="btn btn-secondary" @click="showWebRtcModal = false">Close</button>
            </div>
          </div>
        </div>
      </div>
    </template>

          <div style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px;">

          <div style="flex-grow: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px;">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 0.8rem; line-height: 1.5; background: rgba(0,0,0,0.25); padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
              <div>
                <span style="color: var(--text-muted);">Application Name:</span> <strong style="color: white;">Holo-Apps WebOS Control Panel</strong>
              </div>
              <div>
                <span style="color: var(--text-muted);">Operating System:</span> <strong style="color: #38bdf8;">Substrate Wasm Peer Kernel (L3)</strong>
              </div>
              <div>
                <span style="color: var(--text-muted);">Replication Model:</span> <strong style="color: var(--success);">WebRTC Swarm link / AS2 DAG</strong>
              </div>
              <div>
                <span style="color: var(--text-muted);">State Reduction:</span> <strong style="color: #c084fc;">Deterministic Topological reduction (L1)</strong>
              </div>
            </div>

            <!-- Monitors -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 0.8rem;">
              <div class="widget-card" style="padding: 10px;">
                <div class="widget-header" style="font-size: 0.7rem;">Causal Ledger Log Size</div>
                <div class="widget-value" style="font-size: 1.1rem; margin-top: 4px;" x-text="activeWorkspace ? activeWorkspace.collection.events.size + ' events' : 'offline'"></div>
              </div>
              <div class="widget-card" style="padding: 10px;">
                <div class="widget-header" style="font-size: 0.7rem;">Active Swarm Front Forks</div>
                <div class="widget-value" style="font-size: 1.1rem; margin-top: 4px;" x-text="activeWorkspace ? activeWorkspace.collection.heads.size + ' heads' : 'idle'"></div>
              </div>
            </div>

            <!-- Recovery & Backups -->
            <div style="background: rgba(255,255,255,0.02); padding: 16px; border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 10px;">
              <span style="font-size: 0.85rem; font-weight: 700; color: white;">🔑 Account Backup & Recovery</span>
              <p style="color: var(--text-secondary); font-size: 0.8rem; line-height: 1.4; margin: 0;">
                Your account keys are saved locally in your browser's secure storage. Export an account backup to restore access on other devices.
              </p>
              <div style="display: flex; gap: 12px; margin-top: 4px;">
                <button class="btn" style="font-size: 0.8rem; padding: 6px 12px;" @click="exportIdentity()">
                  Export Account Backup
                </button>
                <button class="btn" style="background: var(--error); border-color: rgba(239, 68, 68, 0.2); font-size: 0.8rem; padding: 6px 12px;" @click="clearIdentity()">
                  Wipe Account Data
                </button>
              </div>
            </div>

            <!-- Terminal -->
            <div class="terminal-box" style="height: 180px; flex-shrink: 0; margin-top: 0;">
              <div class="terminal-header">
                <div class="terminal-dots">
                  <div class="terminal-dot close"></div>
                  <div class="terminal-dot minimize"></div>
                  <div class="terminal-dot expand"></div>
                </div>
                <span>causal-ledger@webos: /dev/substrate</span>
                <span style="font-size: 0.65rem; color: #10b981;">● active</span>
              </div>
              <div class="terminal-body" style="font-size: 0.75rem;">
                <div class="terminal-line"><span class="terminal-prompt">[holo-apps-kernel]</span> initializing WebOS Control Panel terminal monitor...</div>
                <div class="terminal-line"><span class="terminal-prompt">[holo-apps-kernel]</span> loading decentralized ActivityStreams event logs...</div>
                
                <template x-if="!activeWorkspace || rawEventStream.length === 0">
                  <div class="terminal-line" style="color: var(--text-muted);">No transaction logs recorded. Select a Workspace to display ActivityStreams JSON-LD stream.</div>
                </template>
                
                <template x-for="jsonStr in rawEventStream" :key="jsonStr">
                  <pre style="color: #a855f7; margin-bottom: 8px; font-size: 0.7rem;" x-text="jsonStr"></pre>
                </template>
              </div>
            </div>
          </div>
          
          <button class="btn btn-secondary" style="width: 100%;" @click="showDiagnosticsModal = false">Close Diagnostics</button>
        </div>
      </div>
    </template>

    <!-- Add Calendar Event Modal -->
    <template x-if="showAddEventModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Add Calendar Event</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" class="input" placeholder="Event Title" x-model="newCalendarEventTitle" />
            <input type="datetime-local" class="input" x-model="newCalendarEventDate" />
            <textarea class="input" placeholder="Event Description (Summary)" style="height: 80px;" x-model="newCalendarEventDescription"></textarea>
            
            <div style="display: flex; gap: 8px;">
              <button class="btn" @click="createCalendarEvent()" :disabled="!newCalendarEventTitle || !newCalendarEventDate">Add Event</button>
              <button class="btn btn-secondary" @click="showAddEventModal = false">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Add Media Item Modal -->
    <template x-if="showAddMediaModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Add Media & Applications</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" class="input" placeholder="Title" x-model="newMediaItemTitle" />
            <input type="text" class="input" placeholder="Media/Bundle URL" x-model="newMediaItemUrl" />
            
            <div style="display: flex; flex-direction: column; gap: 4px; text-align: left;">
              <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;">Media Type:</label>
              <select x-model="newMediaItemType" class="input" style="background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-size: 0.85rem;">
                <option value="image/png" style="background: #1e293b;">Image (PNG/JPG)</option>
                <option value="video/mp4" style="background: #1e293b;">Video (MP4)</option>
                <option value="application/vnd.ms-powerpoint" style="background: #1e293b;">Slides Presentation</option>
                <option value="application/pdf" style="background: #1e293b;">PDF Document</option>
                <option value="application/x-holo-app" style="background: #1e293b;">⚙️ Holo-App Bundle Package</option>
                <option value="application/manifest+json" style="background: #1e293b;">📋 W3C Web App Manifest</option>
              </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px; text-align: left;">
              <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;">Privacy Scope:</label>
              <select x-model="newMediaItemPrivacy" class="input" style="background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-size: 0.85rem;">
                <option value="public" style="background: #1e293b;">🌐 Swarm Public (Registry-visible)</option>
                <option value="workspace" style="background: #1e293b;">👥 Workspace Only (Shared context)</option>
                <option value="private" style="background: #1e293b;">🔒 Private (Creator Only)</option>
              </select>
            </div>

            <textarea class="input" placeholder="Summary Description" style="height: 60px;" x-model="newMediaItemSummary"></textarea>
            
            <div style="display: flex; gap: 8px;">
              <button class="btn" @click="createMediaItem()" :disabled="!newMediaItemTitle || !newMediaItemUrl">Add Media</button>
              <button class="btn btn-secondary" @click="showAddMediaModal = false">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Add Workspace Contact Modal -->
    <template x-if="showAddWorkspaceContactModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Add Workspace Contact Manually</h2>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <input type="text" class="input" placeholder="Alias Name (e.g. Alice)" x-model="newWorkspaceContactAlias" />
              <input type="text" class="input" placeholder="Account ID (κ)" x-model="newWorkspaceContactId" />
              <input type="text" class="input" placeholder="Message Encryption Key" x-model="newWorkspaceContactCurveId" />
              
              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn" @click="createWorkspaceContact()" :disabled="!newWorkspaceContactId || !newWorkspaceContactCurveId">Add Workspace Contact</button>
                <button class="btn btn-secondary" @click="showAddWorkspaceContactModal = false">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Incoming Call Overlay Modal -->
    <template x-if="incomingCall">
      <div class="overlay" style="z-index: 1000;">
        <div class="dialog glass" style="max-width: 400px; text-align: center; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 16px; border: 1px solid var(--accent); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);">
          <div style="font-size: 3rem; animation: pulse 1s infinite;">📞</div>
          <h2>Incoming Call</h2>
          <div style="font-size: 1.1rem; font-weight: 700; color: white;" x-text="incomingCall.callerName">Caller Name</div>
          <div style="font-size: 0.8rem; color: var(--text-secondary);">Is calling you peer-to-peer over secure WebRTC stream...</div>
          
          <div style="display: flex; gap: 12px; width: 100%; margin-top: 10px;">
            <button class="btn btn-success" style="flex: 1;" @click="acceptCall(incomingCall.id)">Answer</button>
            <button class="btn" style="background: var(--error); flex: 1;" @click="declineCall(incomingCall.id)">Decline</button>
          </div>
        </div>
      </div>
    </template>

    <!-- Running App Sandbox Overlay Modal -->
    <template x-if="activeRunningApp">
      <div class="overlay" style="z-index: 1100;">
        <div class="dialog glass" style="max-width: 600px; width: 90%; text-align: left; padding: 24px; border: 1px solid #a78bfa; box-shadow: 0 0 25px rgba(167, 139, 250, 0.4); display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 1.5rem;">⚙️</span>
              <div>
                <h2 style="font-size: 1.25rem; font-weight: 700; color: white; margin: 0;" x-text="'Running Sandbox: ' + activeRunningApp.name">App</h2>
                <span style="font-size: 0.72rem; color: var(--text-secondary);" x-text="'W3C Bundle Address: ' + activeRunningApp.url"></span>
              </div>
            </div>
            <button class="btn btn-secondary" style="padding: 2px 8px;" @click="activeRunningApp = null">Close Sandbox</button>
          </div>

          <!-- App Simulator Shell -->
          <div style="background: #090d16; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 20px; min-height: 200px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;">
            <div style="color: #a78bfa; font-size: 3rem; margin-top: 10px; animation: pulse 1.5s infinite;">⚡</div>
            <div>
              <strong style="color: white; font-size: 1.05rem;" x-text="activeRunningApp.name + ' UI is live'">App Live</strong>
              <p style="color: var(--text-secondary); font-size: 0.8rem; line-height: 1.5; margin-top: 8px; max-width: 400px;" x-text="'Standard ActivityStreams client sandbox initialized successfully. All state updates are synchronized via parent workspace collection ' + activeWorkspace.id.substring(0, 12) + '...'"></p>
            </div>
            <div style="font-family: monospace; font-size: 0.7rem; color: var(--text-muted); background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 4px; width: 100%; border: 1px solid rgba(255,255,255,0.03); margin-top: 20px;" x-text="'Bundle Hash: ' + activeRunningApp.id"></div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn" style="background: #6d28d9; border: none; font-size: 0.8rem;" @click="alert('ActivityStreams state synchronized: ' + activeRunningApp.name + ' is registered!')">Sync State</button>
            <button class="btn btn-secondary" style="font-size: 0.8rem;" @click="activeRunningApp = null">Exit</button>
          </div>
        </div>
      </div>
    </template>

  </body>
</html>
