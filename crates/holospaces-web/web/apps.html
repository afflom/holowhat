<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holo-Apps WebOS Control Panel</title>
    <link href="/assets/css/reset.css" rel="stylesheet" />
    <link href="/assets/css/apps.css" rel="stylesheet" />
    <link rel="icon" href="/assets/img/globe-alt.svg" sizes="any" type="image/svg+xml" />
    
    <script type="module" src="/assets/scripts/holo-apps.js"></script>
    <script type="module" src="/assets/scripts/holo-messenger.js"></script>
    <script type="module" src="/assets/scripts/apps.js"></script>
  </head>
  <body x-data="shell">
    
    <!-- Sign-In / Identity Verification Overlay -->
    <template x-if="!participant">
      <div class="overlay">
        <div class="dialog glass">
          <h2>User Account Sign-In</h2>
          <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4;">
            Sign in to access your workspaces and secure communication channels.
          </p>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" class="input" placeholder="Display Nickname (e.g. Alice)" x-model="nicknameInput" />
            <button class="btn" @click="createNewIdentity()">
              Create New User Profile
            </button>
            <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">or load existing</div>
            <input type="text" class="input" placeholder="Paste Account Backup Payload" x-model="privateKeyHexInput" />
            <button class="btn btn-secondary" @click="loadExistingIdentity()" :disabled="!privateKeyHexInput">
              Import Profile
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Main Shell App View -->
    <template x-if="participant">
      <div class="shell-container">
        
        <!-- Sidebar Navigation Tree -->
        <div class="sidebar">
          <div class="sidebar-header">
            <div class="logo-glow"></div>
            <img class="logo-img" src="/assets/img/globe-alt.svg" />
            <div class="sidebar-title">Holo-Apps OS</div>
          </div>
          
          <div class="sidebar-section">
            <!-- App Navigation -->
            <div class="section-label">System Control Panel</div>
            <ul class="sidebar-list">
              <li class="sidebar-item" :class="{ 'active': activeTab === 'dashboard' }" @click="selectTab('dashboard')">
                <span>Workspace Dashboard</span>
              </li>
              <li class="sidebar-item" :class="{ 'active': activeTab === 'apps' }" @click="selectTab('apps')">
                <span>Index App Store</span>
              </li>
              <li class="sidebar-item" :class="{ 'active': activeTab === 'contacts' }" @click="activeTab = 'contacts'; activeChannel = null; topBarTitle = 'Contacts & Pools Directory'">
                <span>Contacts & Pools</span>
              </li>
            </ul>

            <!-- Workspaces (AS2 Group) -->
            <div class="section-label">Workspaces</div>
            <ul class="sidebar-list">
              <template x-for="ws in workspaces" :key="ws.id">
                <li class="sidebar-item" :class="{ 'active': activeWorkspace?.id === ws.id }" @click="selectWorkspace(ws)">
                  <span x-text="ws.name">Workspace Name</span>
                  <span class="sidebar-item-meta" x-text="ws.id.substring(0, 6)">ID</span>
                </li>
              </template>
            </ul>
            <div style="display: flex; gap: 8px; padding: 0 8px; margin-bottom: 16px;">
              <button class="btn btn-secondary" @click="showCreateWorkspaceModal = true" style="font-size: 0.75rem; padding: 6px 8px; flex: 1;">
                + Create WS
              </button>
              <button class="btn btn-secondary" @click="showJoinWorkspaceModal = true" style="font-size: 0.75rem; padding: 6px 8px; flex: 1;">
                → Join WS
              </button>
            </div>

            <!-- Active Channels (AS2 Conversation) -->
            <template x-if="activeWorkspace">
              <div>
                <div class="section-label" x-text="activeWorkspace.name + ' Channels'">Workspace Channels</div>
                <ul class="sidebar-list">
                  <template x-for="ch in channels" :key="ch.id">
                    <li class="sidebar-item" :class="{ 'active': activeTab === 'channel' && activeChannel?.id === ch.id }" @click="selectChannel(ch)">
                      <span x-text="'# ' + ch.name">Channel Name</span>
                    </li>
                  </template>
                </ul>
                
                <div style="display: flex; gap: 8px; padding: 0 8px;">
                  <button class="btn btn-secondary" @click="showCreateChannelModal = true" style="font-size: 0.75rem; padding: 6px 8px; flex: 1;">
                    + Channel
                  </button>
                  <button class="btn btn-secondary" @click="addMemberToActiveWorkspace()" style="font-size: 0.75rem; padding: 6px 8px; flex: 1;">
                    + Member
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Main Display Panel -->
        <div class="main-content">
          <div class="top-bar">
            <div>
              <h2 style="font-size: 1.2rem; font-weight: 600;" x-text="topBarTitle">Workspace</h2>
            </div>
            
            <div class="user-badge" @click="showIdentityDetails = true" x-show="participant">
              <div class="status-dot"></div>
              <span class="pubkey-abbr" x-text="'User: ' + (participant ? participant.id.substring(0, 12) : '') + '...'">Address</span>
            </div>
          </div>
          
          <div class="content-pane">
            
            <!-- Dashboard Tab (Cryptographic Control Plane) -->
            <template x-if="activeTab === 'dashboard'">
              <div style="display: flex; flex-direction: column; gap: 20px; max-width: 900px; width: 100%;">
                
                <h3 style="font-size: 1.25rem; font-weight: 700; color: white; display: block; margin: 0 0 10px 0;">User Account & Security</h3>
                
                <!-- User ID Card (Human-Centered) -->
                <div class="user-id-card">
                  <svg class="avatar-svg" viewBox="0 0 100 100" x-html="generateAvatarSvg(participant ? participant.id : '')"></svg>
                  <div class="card-details">
                    <div class="card-nickname" x-text="localStorage.getItem('holoapps_nickname') || 'Operator'"></div>
                    <div class="card-holo-id" @click="copyHoloId()" title="Click to copy your unified Holo ID">
                      <span style="font-weight: 600; color: var(--accent);">Your Holo ID:</span>
                      <span x-text="getHoloId()" style="opacity: 0.85;"></span>
                    </div>
                  </div>
                  <button class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;" @click="showIdentityDetails = true">Config</button>
                </div>
                
                <!-- Clean Connection & Network Overview -->
                <div class="system-widgets-grid">
                  <!-- Active Workspace Status Widget -->
                  <div class="widget-card">
                    <div class="widget-header">Current Workspace</div>
                    <div class="widget-value" style="font-family: inherit; font-size: 1.25rem; word-break: break-all; margin-top: 4px;" x-text="activeWorkspace ? activeWorkspace.name : 'No Active Workspace'"></div>
                    <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: auto;" x-text="activeWorkspace ? (activeWorkspace.members.length + ' members • ' + activeWorkspace.channels.length + ' channels') : 'Create or join a workspace to start'"></div>
                  </div>

                  <!-- WebRTC Connection Status Widget -->
                  <div class="widget-card" @click="showWebRtcModal = true" style="cursor: pointer; transition: transform 0.2s, border-color 0.2s;">
                    <div class="widget-header" style="display: flex; justify-content: space-between; align-items: center;">
                      <span>Swarm Status</span>
                      <span style="font-size: 0.7rem; color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; border-radius: 4px;">🔗 Link</span>
                    </div>
                    <div class="widget-value" :style="{ color: isWebRtcConnected ? 'var(--success)' : 'var(--error)' }" x-text="isWebRtcConnected ? 'Online & Syncing' : 'Disconnected (Offline)'" style="font-family: inherit; font-size: 1.25rem; margin-top: 4px;">Disconnected (Offline)</div>
                    <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: auto;" x-text="isWebRtcConnected ? 'Synchronizing workspace events in real-time' : 'Click to connect with peers'"></div>
                  </div>
                </div>

                <!-- Active Workspace Details -->
                <template x-if="activeWorkspace">
                  <div class="settings-section-card">
                    <div class="settings-card-header">
                      <span x-text="'Workspace: ' + activeWorkspace.name"></span>
                      <button class="btn" style="font-size: 0.8rem; padding: 6px 12px;" @click="exportActiveWorkspaceInvite()">
                        Generate Workspace Invite Link/Code
                      </button>
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                      <!-- Members list -->
                      <div style="margin-top: 8px;">
                        <span style="color: var(--text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase;">Workspace Roster:</span>
                        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                          <template x-for="mId in activeWorkspace.members" :key="mId">
                            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.01); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);">
                              <div style="display: flex; flex-direction: column; gap: 4px;">
                                <span style="font-family: monospace; font-size: 0.85rem;" x-text="mId === (participant ? participant.id : '') ? 'You (' + mId.substring(0, 16) + '...)' : mId.substring(0, 16) + '...'"></span>
                                <div style="display: flex; gap: 6px; align-items: center;">
                                  <span style="font-size: 0.7rem; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); color: var(--text-muted);"
                                        x-text="activeWorkspace.collection.capabilities.get(mId)?.includes('admin') ? 'Admin' : 'Member'">
                                  </span>
                                </div>
                              </div>
                              <div style="display: flex; gap: 6px;">
                                <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 2px 8px;" @click="discoverContact(mId, '', 'Member ' + mId.substring(0,6)); alert('Member added to your Default contacts!')">Add to Contacts</button>
                                <template x-if="mId !== (participant ? participant.id : '') && activeWorkspace.collection.capabilities.get(participant.id)?.includes('admin')">
                                  <button class="btn" style="font-size: 0.75rem; padding: 2px 8px; background: var(--accent); border-color: rgba(99,102,241,0.2);"
                                          @click="activeWorkspace.collection.capabilities.get(mId)?.includes('admin') ? demoteWorkspaceMember(mId) : promoteWorkspaceMember(mId)"
                                          x-text="activeWorkspace.collection.capabilities.get(mId)?.includes('admin') ? 'Demote' : 'Promote'">
                                  </button>
                                </template>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Key Custody Card -->
                <div class="settings-section-card">
                  <div class="settings-card-header">🔑 Account Backup & Recovery</div>
                  <p style="color: var(--text-secondary); font-size: 0.85rem; line-height: 1.5;">
                    Your account keys are saved locally in your browser's secure storage. Export an account backup to restore access on other devices.
                  </p>
                  <div style="display: flex; gap: 12px;">
                    <button class="btn" @click="exportIdentity()">
                      Export Account Backup
                    </button>
                    <button class="btn" style="background: var(--error); border-color: rgba(239, 68, 68, 0.2);" @click="clearIdentity()">
                      Wipe Account Data
                    </button>
                  </div>
                </div>

                <!-- Technical Diagnostics (Collapsible for Power Users/Developers) -->
                <details class="settings-section-card" style="background: rgba(255,255,255,0.01); border-color: rgba(255,255,255,0.04); cursor: pointer;">
                  <summary style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600; outline: none; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none;">
                    <span>🖥️ OS Control Panel & Kernel Diagnostics</span>
                    <span style="font-size: 0.75rem;">Click to toggle details</span>
                  </summary>
                  
                  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px; cursor: default;" @click.stop>
                    
                    <!-- Open Standards Schema.org System Overview -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 0.8rem; line-height: 1.5; background: rgba(0,0,0,0.25); padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
                      <div>
                        <span style="color: var(--text-muted);">Application Name:</span> <strong style="color: white;">Holo-Apps WebOS Control Panel</strong>
                      </div>
                      <div>
                        <span style="color: var(--text-muted);">Operating System:</span> <strong style="color: #38bdf8;">Substrate Wasm Peer Kernel (L3)</strong>
                      </div>
                      <div>
                        <span style="color: var(--text-muted);">Replication Model:</span> <strong style="color: var(--success);">WebRTC Swarm link / AS2 DAG</strong>
                      </div>
                      <div>
                        <span style="color: var(--text-muted);">State Reduction:</span> <strong style="color: #c084fc;">Deterministic Topological reduction (L1)</strong>
                      </div>
                    </div>

                    <!-- Hardware & Resource Monitors Grid -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 0.8rem;">
                      <div class="widget-card" style="padding: 10px;">
                        <div class="widget-header" style="font-size: 0.7rem;">Causal Ledger Log Size</div>
                        <div class="widget-value" style="font-size: 1.1rem; margin-top: 4px;" x-text="activeWorkspace ? activeWorkspace.collection.events.size + ' events' : 'offline'"></div>
                      </div>
                      <div class="widget-card" style="padding: 10px;">
                        <div class="widget-header" style="font-size: 0.7rem;">Active Swarm Front Forks</div>
                        <div class="widget-value" style="font-size: 1.1rem; margin-top: 4px;" x-text="activeWorkspace ? activeWorkspace.collection.heads.size + ' heads' : 'idle'"></div>
                      </div>
                    </div>

                    <!-- Workspace ID Card -->
                    <template x-if="activeWorkspace">
                      <div>
                        <span style="color: var(--text-muted); font-size: 0.8rem; font-weight: 500;">Workspace ID (κ):</span>
                        <code style="display: block; font-family: monospace; font-size: 0.78rem; word-break: break-all; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; color: #38bdf8; border: 1px solid var(--border); margin-top: 4px;" x-text="activeWorkspace.id"></code>
                      </div>
                    </template>

                    <!-- Keys and Configuration Card -->
                    <div style="display: flex; flex-direction: column; gap: 12px; font-family: 'Source Code Pro', monospace; font-size: 0.8rem;">
                      <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                          <span style="color: var(--text-muted); font-weight: 500;">Signing Account ID (ECDSA):</span>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
                          <div style="overflow-x: auto; word-break: break-all; flex-grow: 1; color: #38bdf8; font-size: 0.75rem;" x-text="participant ? participant.id : ''"></div>
                          <button class="btn btn-secondary" style="font-size: 0.7rem; padding: 2px 6px;" @click="navigator.clipboard.writeText(participant ? participant.id : ''); alert('Copied Account ID')">Copy</button>
                        </div>
                      </div>
                      <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                          <span style="color: var(--text-muted); font-weight: 500;">Message Encryption Key (ECDH):</span>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
                          <div style="overflow-x: auto; word-break: break-all; flex-grow: 1; color: #c084fc; font-size: 0.75rem;" x-text="participant ? participant.curveId : ''"></div>
                          <button class="btn btn-secondary" style="font-size: 0.7rem; padding: 2px 6px;" @click="navigator.clipboard.writeText(participant ? participant.curveId : ''); alert('Copied Encryption Key')">Copy</button>
                        </div>
                      </div>
                    </div>

                    <!-- Live Causal Event Stream (JSON-LD Terminal Console) -->
                    <div class="terminal-box" style="height: 180px;">
                      <div class="terminal-header">
                        <div class="terminal-dots">
                          <div class="terminal-dot close"></div>
                          <div class="terminal-dot minimize"></div>
                          <div class="terminal-dot expand"></div>
                        </div>
                        <span>causal-ledger@webos: /dev/substrate</span>
                        <span style="font-size: 0.65rem; color: #10b981;">● active</span>
                      </div>
                      <div class="terminal-body" style="font-size: 0.75rem;">
                        <div class="terminal-line"><span class="terminal-prompt">[holo-apps-kernel]</span> initializing WebOS Control Panel terminal monitor...</div>
                        <div class="terminal-line"><span class="terminal-prompt">[holo-apps-kernel]</span> loading decentralized ActivityStreams event logs...</div>
                        
                        <template x-if="!activeWorkspace || rawEventStream.length === 0">
                          <div class="terminal-line" style="color: var(--text-muted);">No transaction logs recorded. Select a Workspace to display ActivityStreams JSON-LD stream.</div>
                        </template>
                        
                        <template x-for="jsonStr in rawEventStream" :key="jsonStr">
                          <pre style="color: #a855f7; margin-bottom: 8px; font-size: 0.7rem;" x-text="jsonStr"></pre>
                        </template>
                      </div>
                    </div>

                  </div>
                </details>

              </div>
            </template>

            <!-- App Store / Index Tab -->
            <template x-if="activeTab === 'apps'">
              <div>
                <h3 style="font-weight: 600; margin-bottom: 16px;">Gateway App Index</h3>
                
                <!-- FreeDesktop.org Desktop Entry Metadata Card -->
                <div class="settings-section-card" style="margin-bottom: 20px;">
                  <div class="settings-card-header">
                    <span>📁 FreeDesktop.org App Launch Manifests</span>
                  </div>
                  <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4;">
                    Applications installed in this workspace run directly in your browser. All configuration settings are managed securely within your workspace profile.
                  </p>
                </div>

                <div class="apps-grid">
                  <template x-for="app in indexApps" :key="app.id">
                    <div class="app-card glass">
                      <div class="app-card-title" x-text="app.name">App Name</div>
                      <div class="app-card-desc">
                        Fast client-side chat application with secure message encryption.
                      </div>
                      <div class="app-card-meta">
                        App ID: <span x-text="app.id.substring(0, 16) + '...'"></span>
                      </div>
                      <div style="display: flex; gap: 8px; margin-top: auto;">
                        <template x-if="!isAppInstalled(app.id)">
                          <button class="btn" @click="installIndexApp(app)">Install App</button>
                        </template>
                        <template x-if="isAppInstalled(app.id)">
                          <button class="btn btn-success" style="cursor: not-allowed; opacity: 0.7;" disabled>Installed</button>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Contacts & Pools Tab -->
            <template x-if="activeTab === 'contacts'">
              <div style="display: flex; gap: 24px; width: 100%; height: 100%;">
                
                <!-- Left Pools Selector Pane -->
                <div class="glass" style="width: 250px; padding: 20px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px;">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--text-secondary);">Contact Pools</h4>
                    <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 0.8rem;" @click="showCreatePoolModal = true">+</button>
                  </div>
                  
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <div 
                      class="sidebar-item" 
                      :class="{ 'active': selectedPoolId === 'all' }" 
                      @click="selectedPoolId = 'all'"
                      style="display: flex; justify-content: space-between; align-items: center;"
                    >
                      <span>Show All</span>
                      <span class="sidebar-item-meta" x-text="contacts.length">0</span>
                    </div>
                    <template x-for="pool in contactPools" :key="pool.id">
                      <div 
                        class="sidebar-item" 
                        :class="{ 'active': selectedPoolId === pool.id }" 
                        @click="selectedPoolId = pool.id"
                        style="display: flex; justify-content: space-between; align-items: center;"
                      >
                        <span x-text="pool.name">Pool Name</span>
                        <span class="sidebar-item-meta" x-text="contacts.filter(c => c.pools?.includes(pool.id)).length">0</span>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Right Directory Contacts list -->
                <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px;">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 1.25rem; font-weight: 700;">Contacts Directory (ActivityStreams Person)</h3>
                    <button class="btn" @click="showAddContactModal = true">+ Add Contact Manually</button>
                  </div>
                  
                  <!-- Online Peers Nearby Discovery section (Human-Centered) -->
                  <div class="nearby-peers-section">
                    <h4 style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                      <div class="status-dot" :style="{ background: isWebRtcConnected ? 'var(--success)' : 'var(--error)', boxShadow: isWebRtcConnected ? '0 0 8px var(--success)' : '0 0 8px var(--error)' }"></div>
                      <span x-text="isWebRtcConnected ? 'Online Nearby Peers Discovered (Local Swarm)' : 'Nearby Peers (Offline)'">Online Nearby Peers Discovered (Local Swarm)</span>
                    </h4>
                    <div class="peer-list" x-show="discoveredPeers.length > 0">
                      <template x-for="peer in discoveredPeers" :key="peer.id">
                        <div class="peer-item">
                          <div class="peer-info">
                            <svg class="avatar-svg" style="width: 32px; height: 32px;" viewBox="0 0 100 100" x-html="generateAvatarSvg(peer.id)"></svg>
                            <div>
                              <strong x-text="peer.name" style="color: white; font-size: 0.9rem;"></strong>
                              <span style="color: var(--text-muted); font-size: 0.72rem; display: block; font-family: monospace;" x-text="'did:key:' + peer.id.substring(0, 16) + '...'"></span>
                            </div>
                          </div>
                          <button class="btn" style="font-size: 0.75rem; padding: 4px 10px;" @click="addDiscoveredContact(peer)">Add Contact</button>
                        </div>
                      </template>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); padding: 8px 0;" x-show="discoveredPeers.length === 0">
                      <span x-text="isWebRtcConnected ? 'Scanning local swarm link for active peers online...' : 'Connect to a peer via WebRTC to start scanning nearby peers.'">Scanning local swarm link for active peers online...</span>
                    </div>
                  </div>
                  
                  <div class="contact-card-grid">
                    <template x-for="c in contacts.filter(c => selectedPoolId === 'all' || c.pools?.includes(selectedPoolId))" :key="c.id">
                      <div class="contact-card glass">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                          <div>
                            <div style="font-weight: 700; font-size: 1.1rem; color: white;" x-text="c.name">Contact Alias</div>
                            <div style="font-family: monospace; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px;" x-text="'κ: ' + c.id.substring(0, 24) + '...'"></div>
                            <div style="font-family: monospace; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;" x-text="'ECDH: ' + c.curveId.substring(0, 24) + '...'"></div>
                          </div>
                          
                          <template x-if="c.id !== (participant ? participant.id : '')">
                            <button class="btn btn-secondary" style="background: var(--error); border: none; padding: 4px 10px; font-size: 0.8rem;" @click="deleteContact(c.id)">Delete</button>
                          </template>
                        </div>
                        
                        <!-- Pools association -->
                        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px;">
                          <span style="font-size: 0.75rem; color: var(--text-muted);">Assigned Pools:</span>
                          <template x-for="pool in contactPools" :key="pool.id">
                            <button 
                              class="btn" 
                              :style="{ 
                                fontSize: '0.7rem', 
                                padding: '2px 8px', 
                                background: c.pools?.includes(pool.id) ? 'rgba(99, 102, 241, 0.2)' : 'transparent',
                                borderColor: c.pools?.includes(pool.id) ? '#6366f1' : 'rgba(255,255,255,0.1)',
                                color: c.pools?.includes(pool.id) ? 'white' : 'var(--text-secondary)'
                              }"
                              @click="toggleContactPool(c.id, pool.id)"
                              x-text="pool.name"
                            ></button>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <!-- Channel / Chat Tab (Dynamic Component Delegation) -->
            <template x-if="activeTab === 'channel' && activeChannel">
              <div style="width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; margin-top: -16px;">
                <messenger-block :channel-id="activeChannel.id" style="width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;"></messenger-block>
              </div>
            </template>

          </div>
        </div>

      </div>
    </template>

    <!-- OS bottom launcher dock -->
    <template x-if="participant">
      <div class="os-dock">
        <div class="os-dock-item" :class="{ 'active': activeTab === 'dashboard' }" @click="selectTab('dashboard')" title="OS Control Panel">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
          <span>System</span>
        </div>
        <div class="os-dock-item" :class="{ 'active': activeTab === 'apps' }" @click="selectTab('apps')" title="App Store">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          <span>Apps</span>
        </div>
        <div class="os-dock-item" :class="{ 'active': activeTab === 'contacts' }" @click="activeTab = 'contacts'; activeChannel = null; topBarTitle = 'Contacts & Pools Directory'" title="Contacts Directory">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span>Contacts</span>
        </div>
        <div class="os-dock-item" @click="window.location.href = 'login.html'" title="Playground 2.0 Canvas">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>Playground</span>
        </div>
      </div>
    </template>

    <!-- Modals -->

    <!-- Create Workspace Modal -->
    <template x-if="showCreateWorkspaceModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Create New Workspace</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" class="input" placeholder="Workspace Name" x-model="newWorkspaceName" />
            <div style="display: flex; gap: 8px;">
              <button class="btn" @click="createWorkspace()" :disabled="!newWorkspaceName">Create</button>
              <button class="btn btn-secondary" @click="showCreateWorkspaceModal = false">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Join Workspace Modal -->
    <template x-if="showJoinWorkspaceModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Join Workspace</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <p style="color: var(--text-secondary); font-size: 0.85rem; line-height: 1.4;">
              Paste the Workspace Pass code shared by another peer to join.
            </p>
            <input type="text" class="input" placeholder="Paste Workspace Invite Code" x-model="inviteCodeInput" @input="validateAndPreviewPass(inviteCodeInput)" />
            
            <!-- Live Ticket Preview Card (Human Centered) -->
            <template x-if="passPreview">
              <div class="pass-preview-card">
                <div style="font-weight: 700; font-size: 0.85rem; color: var(--success); display: flex; align-items: center; gap: 6px;">
                  <span>✓ Valid Workspace Pass</span>
                </div>
                <div style="margin-top: 6px; font-size: 0.8rem; color: white;">
                  <strong>Name:</strong> <span x-text="passPreview.name"></span>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-secondary);">
                  <strong>Creator:</strong> did:key:<span x-text="passPreview.creator"></span>
                </div>
              </div>
            </template>
            
            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <button class="btn" @click="joinWorkspace()" :disabled="!inviteCodeInput">Join</button>
              <button class="btn btn-secondary" @click="showJoinWorkspaceModal = false; passPreview = null">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Create Channel Modal -->
    <template x-if="showCreateChannelModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Create New Channel</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" class="input" placeholder="Channel Name" x-model="newChannelName" />
            <div style="display: flex; flex-direction: column; gap: 4px; text-align: left;">
              <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;">Who can post messages:</label>
              <select x-model="newChannelWritePolicy" class="input" style="background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-size: 0.85rem; cursor: pointer;">
                <option value="all" style="background: #1e293b;">Everyone (Workspace Members)</option>
                <option value="creator" style="background: #1e293b;">Only Channel Creator</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn" @click="createChannel()" :disabled="!newChannelName">Create</button>
              <button class="btn btn-secondary" @click="showCreateChannelModal = false">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Join Channel Modal -->
    <template x-if="showJoinChannelModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Join Channel</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <p style="color: var(--text-secondary); font-size: 0.85rem; line-height: 1.4;">
              Paste the invite code shared by an administrator of the channel to import the genesis and obtain capabilities.
            </p>
            <input type="text" class="input" placeholder="Paste Invite Code" x-model="inviteCodeInput" />
            <div style="display: flex; gap: 8px;">
              <button class="btn" @click="joinChannel()" :disabled="!inviteCodeInput">Join</button>
              <button class="btn btn-secondary" @click="showJoinChannelModal = false">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Add Contact Modal -->
    <template x-if="showAddContactModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Add Contact Manually</h2>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Option 1: Paste Holo ID (Premium Simple) -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <span style="font-size: 0.8rem; font-weight: 600; color: var(--accent);">Option 1: Paste Holo ID</span>
              <input type="text" class="input" placeholder="e.g. @nickname:base64..." x-model="holoIdInput" @input="newContactId = ''; newContactCurveId = ''" />
              <button class="btn" @click="importHoloIdContact()" :disabled="!holoIdInput">Import via Holo ID</button>
            </div>
            
            <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">— OR —</div>
            
            <!-- Option 2: Manual Cryptographic Keys (Advanced) -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Option 2: Advanced Manual Keys</span>
              <input type="text" class="input" placeholder="Alias Name (e.g. Alice)" x-model="newContactAlias" @input="holoIdInput = ''" />
              <input type="text" class="input" placeholder="Account ID" x-model="newContactId" @input="holoIdInput = ''" />
              <input type="text" class="input" placeholder="Message Encryption Key" x-model="newContactCurveId" @input="holoIdInput = ''" />
              <button class="btn btn-secondary" @click="createContact()" :disabled="!newContactId || !newContactCurveId">Add Contact</button>
            </div>
            
            <button class="btn btn-secondary" style="margin-top: 8px;" @click="showAddContactModal = false; holoIdInput = ''">Cancel</button>
          </div>
        </div>
      </div>
    </template>

    <!-- Create Pool Modal -->
    <template x-if="showCreatePoolModal">
      <div class="overlay">
        <div class="dialog glass">
          <h2>Create Contact Pool</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" class="input" placeholder="Pool Name (e.g. Collaborators)" x-model="newPoolName" />
            <div style="display: flex; gap: 8px;">
              <button class="btn" @click="createPool()" :disabled="!newPoolName">Create Pool</button>
              <button class="btn btn-secondary" @click="showCreatePoolModal = false">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Profile Detail / Export Modal -->
    <template x-if="showIdentityDetails">
      <div class="overlay" @click="showIdentityDetails = false">
        <div class="dialog glass" @click.stop>
          <h2>Account Configuration</h2>
          <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4;">
            Your account keys are saved locally in your browser's secure storage. Export an account backup to restore access on other devices.
          </p>
          <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 12px;">
            <div>
              <span style="font-weight: 600; font-size: 0.85rem;">Account Key:</span>
              <div style="font-family: 'Source Code Pro', monospace; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem; word-break: break-all;" x-text="participant ? participant.id : ''"></div>
            </div>
            <button class="btn btn-secondary" @click="exportIdentity()">Export Account Backup</button>
            <button class="btn btn-secondary" style="background: var(--error);" @click="clearIdentity()">Wipe Account Data</button>
            <button class="btn btn-success" @click="showIdentityDetails = false">Close</button>
          </div>
        </div>
      </div>
    </template>

    <!-- P2P WebRTC Connection Modal -->
    <template x-if="showWebRtcModal">
      <div class="overlay">
        <div class="dialog glass" style="max-width: 600px; width: 100%;">
          <h2>P2P WebRTC Connection Link</h2>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <p style="color: var(--text-secondary); font-size: 0.85rem; line-height: 1.4;">
              Establish a direct, serverless peer-to-peer WebRTC connection with another peer to sync updates in real-time.
            </p>
            
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
              <button class="btn" :class="{ 'btn-secondary': webrtcRole !== 'initiate' }" @click="webrtcRole = 'initiate'" style="flex: 1;">A: Initiate (Offerer)</button>
              <button class="btn" :class="{ 'btn-secondary': webrtcRole !== 'receive' }" @click="webrtcRole = 'receive'" style="flex: 1;">B: Accept (Answerer)</button>
            </div>
            
            <template x-if="webrtcRole === 'initiate'">
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn" @click="generateOffer()">1. Generate Offer Connection Code</button>
                
                <template x-if="webrtcOfferCode">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Share this Offer Code with your peer:</label>
                    <textarea class="input" style="height: 100px; font-family: monospace; font-size: 0.75rem;" readonly x-text="webrtcOfferCode" onclick="this.select()"></textarea>
                    <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px;" @click="navigator.clipboard.writeText(webrtcOfferCode); alert('Offer Code copied to clipboard!')">Copy Offer Code</button>
                  </div>
                </template>
                
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px;">
                  <label style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;">2. Paste Answer Code from your peer:</label>
                  <textarea class="input" style="height: 80px; font-family: monospace; font-size: 0.75rem;" placeholder="Paste Answer Code here..." x-model="webrtcAnswerCodeInput"></textarea>
                  <button class="btn" @click="completeConnection()" :disabled="!webrtcAnswerCodeInput">Connect Peer</button>
                </div>
              </div>
            </template>
            
            <template x-if="webrtcRole === 'receive'">
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <label style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;">1. Paste Offer Code from peer:</label>
                  <textarea class="input" style="height: 80px; font-family: monospace; font-size: 0.75rem;" placeholder="Paste Offer Code here..." x-model="webrtcOfferCodeInput"></textarea>
                  <button class="btn" @click="generateAnswer()" :disabled="!webrtcOfferCodeInput">2. Generate Answer Connection Code</button>
                </div>
                
                <template x-if="webrtcAnswerCode">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Share this Answer Code with your peer to open the link:</label>
                    <textarea class="input" style="height: 100px; font-family: monospace; font-size: 0.75rem;" readonly x-text="webrtcAnswerCode" onclick="this.select()"></textarea>
                    <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px;" @click="navigator.clipboard.writeText(webrtcAnswerCode); alert('Answer Code copied to clipboard!')">Copy Answer Code</button>
                  </div>
                </template>
              </div>
            </template>
            
            <div style="display: flex; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px;">
              <button class="btn btn-secondary" @click="showWebRtcModal = false">Close</button>
            </div>
          </div>
        </div>
      </div>
    </template>

  </body>
</html>
