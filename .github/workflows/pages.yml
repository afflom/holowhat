name: pages

# Strict GitHub Pages Deployment Pipeline gated by CI.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Site
    environment:
      name: github-pages
      url: https://afflom.github.io/holowhat/
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.0'

      - name: Setup vendor dependencies
        run: |
          chmod +x scripts/setup-vendor.sh
          ./scripts/setup-vendor.sh

      - name: Build and assemble site
        run: |
          chmod +x scripts/build-site.sh
          ./scripts/build-site.sh

      - name: Deploy to the gh-pages root (production)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          # Never wipe the per-PR preview deployments living alongside production.
          clean-exclude: |
            pr-preview/**
          commit-message: "deploy: Platform Manager → gh-pages root (${{ github.sha }})"
