<div @click.stop="" @click.outside="spotlightOpen = false" class="wrapper">
  <div class="search">
    <img src="/assets/img/search.svg" /><input autofocus="" x-model="search" />
  </div>
  <div class="results" x-effect="filter(search)">
    <template x-for="item in items">
      <div
        class="item"
        x-text="item.name"
        @click="openLibrary(item.name)"
      ></div>
    </template>
  </div>
</div>

<script type="module">
  export default {
    mixins: ["@playground/block-mixin"],

    search: "",
    results: [],
    items: [],
    async init() {
      this.$el.querySelector("input").focus()

      this.results = await fetch("/blocks/@playground", {
        headers: { accept: "application/json" },
      }).then((resp) => resp.json())
      this.items = this.results
    },
    filter() {
      this.items = this.results.filter((i) =>
        i.name.toLowerCase().includes(this.search.toLowerCase()),
      )
    },
    openLibrary(location) {
      const x = Number(this.props.x)
      const y = Number(this.props.y)

      this.world = document
        .querySelector("world-block")
        .shadowRoot.querySelector(".world")
      this.space = document
        .querySelector("world-block")
        .shadowRoot.querySelector(".space")

      const screenWidth = window.innerWidth / 2 - 500
      const screenHeight = window.innerHeight / 2 - 200

      const libraryHtml = `<library-block selected-package="@playground" ${
        typeof location === "string"
          ? `selected-file="${location + "-block"}"`
          : ""
      } x="${screenWidth + this.scrollX}" y="${
        screenHeight + this.scrollY
      }"></library-block>`

      const world = document.querySelector("world-block")
      if (world) {
        world.insertAdjacentHTML("beforeend", libraryHtml)
      }
      this.spotlightOpen = false
    },
  }
</script>
