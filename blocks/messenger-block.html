<div class="msg-wrapper" x-data="messengerBlock">
  <!-- Header Bar -->
  <div class="chat-header">
    <div class="channel-info">
      <span class="hash-tag">#</span>
      <div class="channel-meta">
        <h3 class="channel-name" x-text="getChannelName()">general</h3>
        <span class="channel-topic">Swarm Ledger: <code class="channel-topic-id" x-text="(props.channelId || '').substring(0, 12) + '...'"></code></span>
      </div>
    </div>
    
    <div class="header-actions">
      <!-- Search Box -->
      <div class="search-wrapper">
        <input type="text" class="search-input" placeholder="Search in channel..." x-model="searchQuery" />
        <template x-if="searchQuery">
          <button class="clear-search-btn" @click="searchQuery = ''">×</button>
        </template>
      </div>

      <!-- Member List Toggle Button -->
      <button class="toggle-members-btn" @click="showMembersList = !showMembersList" :class="{ 'active': showMembersList }" title="Toggle Member List">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="member-count-badge" x-text="getChannelMembers().length">0</span>
      </button>
    </div>
  </div>

  <div class="chat-main-area">
    <!-- Messages & Logs Pane -->
    <div class="timeline-pane">
      <div class="messages-list" id="chat-scroller">
        <template x-if="filteredTimeline.length === 0">
          <div class="empty-state-container">
            <div class="empty-state-icon">💬</div>
            <h4>No messages found</h4>
            <p>Type a message or adjust your search filter to get started.</p>
          </div>
        </template>
        
        <template x-for="item in filteredTimeline" :key="item.id">
          <div>
            <!-- SYSTEM LOG ELEMENT -->
            <template x-if="item.isSystem">
              <div class="system-log-row">
                <div class="system-log-card">
                  <span class="system-log-icon" x-text="item.type === 'genesis' ? '🔒' : (item.type === 'membership' ? '⚡' : '🔑')"></span>
                  <div class="system-log-content">
                    <span class="system-log-text" x-text="item.text"></span>
                    <span class="system-log-time" x-text="new Date(item.timestamp).toLocaleTimeString()"></span>
                  </div>
                </div>
              </div>
            </template>

            <!-- REGULAR CHAT MESSAGE ELEMENT -->
            <template x-if="!item.isSystem">
              <div class="message-row" :class="{ 'mine': item.author === identity }" :id="'msg-' + item.id">
                
                <!-- User Avatar -->
                <div class="user-avatar" :style="getUserAvatarStyle(item.author)" x-text="getUserInitials(item.author)"></div>
                
                <div class="message-content">
                  <!-- Meta header -->
                  <div class="message-meta-header">
                    <span class="message-author-name" x-text="getUserDisplayName(item.author)"></span>
                    <span class="message-author-badge" x-text="item.author === identity ? 'You' : 'Member'"></span>
                    <span class="message-time" x-text="new Date(item.timestamp).toLocaleString()"></span>
                    <template x-if="item.edits.length > 0">
                      <span class="message-edited-tag" :title="'Edited clock: ' + item.edits[item.edits.length-1].clock">(edited)</span>
                    </template>
                  </div>

                  <!-- Reply Reference Header -->
                  <template x-if="item.parentMsg">
                    <div class="reply-reference-box" @click="scrollToMessage(item.parentMsg.id)">
                      <span class="reply-arrow">↳</span>
                      <span class="reply-author" x-text="getUserDisplayName(item.parentMsg.author) + ':'"></span>
                      <span class="reply-body-snippet" x-text="item.parentMsg.body.substring(0, 60) + (item.parentMsg.body.length > 60 ? '...' : '')"></span>
                    </div>
                  </template>

                  <!-- Message Body (supports rich format via x-html) -->
                  <div class="message-body-text" x-html="formatMessageBody(item.body)"></div>

                  <!-- Embedded Image Attachment -->
                  <template x-if="item.attachment && item.attachment.type === 'Image'">
                    <div class="attachment-preview-card">
                      <img :src="item.attachment.url" class="embedded-image" @click="window.open(item.attachment.url, '_blank')" />
                    </div>
                  </template>

                  <!-- Reactions Badges List -->
                  <div class="reactions-list" x-show="item.reactions.length > 0">
                    <template x-for="r in item.reactions" :key="r.symbol">
                      <div class="reaction-badge" :class="{ 'active': r.authors.includes(identity) }" @click="toggleReact(item, r.symbol)">
                        <span class="reaction-symbol" x-text="r.symbol"></span>
                        <span class="reaction-count" x-text="r.count"></span>
                        <div class="reaction-tooltip">
                          <span x-text="r.authors.map(a => getUserDisplayName(a)).join(', ')"></span>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Hover Toolbar Actions (Floating popover) -->
                <div class="message-hover-toolbar">
                  <div class="quick-reactions">
                    <button class="toolbar-btn" @click="toggleReact(item, '👍')" title="React 👍">👍</button>
                    <button class="toolbar-btn" @click="toggleReact(item, '❤️')" title="React ❤️">❤️</button>
                    <button class="toolbar-btn" @click="toggleReact(item, '🔥')" title="React 🔥">🔥</button>
                    <button class="toolbar-btn" @click="toggleReact(item, '🎉')" title="React 🎉">🎉</button>
                    <button class="toolbar-btn" @click="toggleReact(item, '😂')" title="React 😂">😂</button>
                  </div>
                  <div class="toolbar-divider"></div>
                  <button class="toolbar-action-btn" @click="setReply(item)" title="Reply to message">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"></polyline><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>
                  </button>
                  <template x-if="item.author === identity">
                    <button class="toolbar-action-btn" @click="startEdit(item)" title="Edit message">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path></svg>
                    </button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Reply Active Indicator Banner -->
      <template x-if="replyingTo">
        <div class="reply-active-banner">
          <div class="reply-banner-content">
            <span class="reply-label">Replying to <strong x-text="getUserDisplayName(replyingTo.author)"></strong>:</span>
            <span class="reply-snippet" x-text="replyingTo.body.substring(0, 80) + (replyingTo.body.length > 80 ? '...' : '')"></span>
          </div>
          <button class="cancel-reply-btn" @click="replyingTo = null">×</button>
        </div>
      </template>

      <!-- Attachment Preview Bar -->
      <template x-if="attachedImageUrl">
        <div class="attachment-active-banner">
          <div class="attachment-banner-content">
            <span class="attachment-label">📎 Attachment Image ready:</span>
            <span class="attachment-url-snippet" x-text="attachedImageUrl.substring(0, 50) + '...'"></span>
          </div>
          <button class="cancel-attachment-btn" @click="attachedImageUrl = ''">×</button>
        </div>
      </template>

      <!-- Input Actions Panel -->
      <div class="input-actions-bar" x-show="showAttachmentInput">
        <input type="text" class="attachment-url-input" placeholder="Paste Image URL here (e.g. https://domain.com/pic.png)..." x-model="attachmentUrlInput" @keydown.enter="applyAttachment()" />
        <button class="apply-attachment-btn" @click="applyAttachment()">Add</button>
        <button class="cancel-attachment-input-btn" @click="showAttachmentInput = false">Cancel</button>
      </div>

      <!-- Input Chat Bar -->
      <div class="input-bar">
        <button class="action-trigger-btn" @click="showAttachmentInput = !showAttachmentInput" :class="{ 'active': showAttachmentInput }" title="Attach Image Object">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        
        <input type="text" class="chat-input" placeholder="Type a message (supports markdown *italics* and **bold**)..." x-model="text" @keydown.enter="send()" />
        <button class="send-btn" @click="send()" :disabled="!text && !attachedImageUrl">Send</button>
        <button class="invite-btn" @click="invite()" title="Invite Operator to Channel">Invite Peer</button>
      </div>
    </div>

    <!-- Right Side Roster Pane -->
    <div class="members-sidebar-pane" x-show="showMembersList" x-transition>
      <div class="sidebar-header-label">Workspace Roster</div>
      <div class="members-scroller">
        <template x-for="m in getChannelMembers()" :key="m.id">
          <div class="member-card">
            <div class="member-avatar-badge-row">
              <div class="user-avatar" :style="getUserAvatarStyle(m.id)" x-text="getUserInitials(m.id)"></div>
              <div class="member-details">
                <span class="member-name" x-text="m.name"></span>
                <span class="member-address" x-text="m.id.substring(0, 16) + '...'"></span>
              </div>
            </div>
            <div class="member-caps-row">
              <template x-for="cap in m.capabilities" :key="cap">
                <span class="cap-badge" :class="cap" x-text="cap"></span>
              </template>
            </div>
            <button class="inspect-did-btn" @click="inspectDid(m.id)">Inspect W3C DID</button>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- Edit Dialog overlay -->
  <template x-if="editing">
    <div class="edit-overlay">
      <div class="edit-dialog glass">
        <h4>Edit Message</h4>
        <input type="text" class="chat-input" x-model="editText" @keydown.enter="saveEdit()" />
        <div class="edit-buttons">
          <button class="send-btn" @click="saveEdit()">Save Changes</button>
          <button class="send-btn cancel" @click="editing = null">Cancel</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script type="module">
  const origin = window.location.origin;
  const base = window.location.pathname.startsWith("/holowhat") ? "/holowhat" : "";
  const { Event, canonicalJson, sha256, base64Encode, base64Decode, HoloAppsCrypto } = await import(`${origin}${base}/assets/scripts/holo-apps.js`);

  export default {
    mixins: [],
    props: {
      channelId: String
    },
    identity: "",
    view: { messages: [] },
    text: "",
    editing: null,
    editText: "",
    
    // Roster & Layout variables
    showMembersList: true,
    searchQuery: "",
    replyingTo: null,
    attachedImageUrl: "",
    showAttachmentInput: false,
    attachmentUrlInput: "",

    async init() {
      this.identity = localStorage.getItem("holoapps_identity_key") || "";
      await this.refresh();
      
      this._pollInterval = setInterval(async () => {
        await this.refresh();
      }, 1000);
      
      // Auto scroll to bottom on initialize
      this.$nextTick(() => {
        this.scrollToBottom();
      });

      // Warm up StandardsValidator context schemas
      try {
        const { StandardsValidator } = await import(`${origin}${base}/assets/scripts/standards-validator.js`);
        await StandardsValidator.init(`${origin}${base}/`);
      } catch (e) {
        console.error("Failed to initialize StandardsValidator context in init:", e);
      }
    },

    destroy() {
      clearInterval(this._pollInterval);
    },

    getShell() {
      const bodyShellEl = document.querySelector("body[x-data='shell']");
      if (bodyShellEl) {
        return Alpine.$data(bodyShellEl);
      }
      const shellBlock = document.querySelector("shell-block");
      if (shellBlock && shellBlock.shadowRoot) {
        const wrapper = shellBlock.shadowRoot.querySelector(".shell-wrapper");
        if (wrapper) return Alpine.$data(wrapper);
      }
      return null;
    },

    getCollection() {
      const shell = this.getShell();
      if (!shell) return null;
      const ch = shell.channels.find(c => c.id === this.channelId);
      return ch ? ch.collection : null;
    },

    getChannelName() {
      const shell = this.getShell();
      if (!shell) return "general";
      const ch = shell.channels.find(c => c.id === this.channelId);
      return ch ? ch.name : "general";
    },

    async refresh() {
      const col = this.getCollection();
      if (col) {
        this.view = await col.render();
        
        // Auto-discover message authors as contacts
        const shell = this.getShell();
        if (shell && typeof shell.discoverContact === "function") {
          for (const msg of this.view.messages) {
            if (msg.author !== this.identity) {
              shell.discoverContact(msg.author, "", "Operator " + msg.author.substring(0, 6));
            }
          }
        }
      }
    },

    // Deterministic HSL Avatar styling
    getUserAvatarStyle(userId) {
      if (!userId) return "background-color: #64748b; color: white;";
      let hash = 0;
      for (let i = 0; i < userId.length; i++) {
        hash = userId.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h = Math.abs(hash % 360);
      const s = 60; 
      const l = 40; 
      return `background-color: hsl(${h}, ${s}%, ${l}%); color: white; border: 1px solid rgba(255,255,255,0.1);`;
    },

    getUserInitials(userId) {
      if (!userId) return "?";
      // Take first two chars of signing public key address
      return userId.substring(2, 4).toUpperCase();
    },

    getUserDisplayName(userId) {
      if (userId === this.identity) return "You";
      const shell = this.getShell();
      if (shell) {
        const contact = shell.contacts.find(c => c.id === userId);
        if (contact) return contact.name;
      }
      return "Operator " + userId.substring(0, 8);
    },

    // Format rich text bodies with basic markdown parser
    formatMessageBody(text) {
      if (!text) return "";
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Code blocks ```code```
      html = html.replace(/```([\s\S]*?)```/g, '<pre class="code-block"><code>$1</code></pre>');
      // Inline code `code`
      html = html.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      // Bold **bold**
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Italic *italic*
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      
      // Auto-link URLs
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      html = html.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`;
      });
      
      return html;
    },

    // Combined timeline getter: messages + system action logs sorted deterministically by clock
    getCombinedTimeline() {
      const messages = this.view.messages || [];
      const systemItems = this.getSystemEvents();
      
      const messageById = new Map();
      for (const m of messages) {
        messageById.set(m.id, m);
      }

      const timeline = [];
      for (const m of messages) {
        let parentMsg = null;
        if (m.parentId) {
          parentMsg = messageById.get(m.parentId) || null;
        }
        timeline.push({
          ...m,
          isSystem: false,
          parentMsg: parentMsg
        });
      }
      
      for (const s of systemItems) {
        if (!timeline.some(t => t.id === s.id)) {
          timeline.push(s);
        }
      }
      
      return timeline.sort((a, b) => {
        if (a.clock !== b.clock) return a.clock - b.clock;
        return a.id.localeCompare(b.id);
      });
    },

    getfilteredTimeline() {
      // Deprecated helper check to back filteredTimeline getter
      return this.filteredTimeline;
    },

    get filteredTimeline() {
      const timeline = this.getCombinedTimeline();
      if (!this.searchQuery) return timeline;
      const q = this.searchQuery.toLowerCase();
      return timeline.filter(item => {
        if (item.isSystem) {
          return item.text.toLowerCase().includes(q);
        }
        return item.body.toLowerCase().includes(q) || 
               item.author.toLowerCase().includes(q) ||
               this.getUserDisplayName(item.author).toLowerCase().includes(q);
      });
    },

    getSystemEvents() {
      const col = this.getCollection();
      if (!col) return [];
      
      const systemItems = [];
      for (const ev of col.events.values()) {
        const kind = ev.header.kind;
        const author = ev.header.author;
        const clock = ev.header.clock;
        const timestamp = (ev.body.payload?.published ? new Date(ev.body.payload.published).getTime() : null) || ev.body.payload?.timestamp || ev.header.clock * 1000 + 1771180000000;
        
        if (kind === "genesis") {
          systemItems.push({
            id: ev.id,
            clock,
            isSystem: true,
            type: "genesis",
            author,
            timestamp,
            text: `Channel was initialized by Operator ${author.substring(0, 8)}...`
          });
        } else if (kind === "membership") {
          const payload = ev.body.cleartext || ev.decodedPayload || {};
          const target = payload.target || "unknown";
          const action = payload.action || "grant";
          systemItems.push({
            id: ev.id,
            clock,
            isSystem: true,
            type: "membership",
            author,
            timestamp,
            text: `Operator ${author.substring(0, 8)}... granted ${action === "grant" ? "Read/Write" : "Revoke"} capabilities to Operator ${target.substring(0, 8)}...`
          });
        } else if (kind === "epoch") {
          systemItems.push({
            id: ev.id,
            clock,
            isSystem: true,
            type: "epoch",
            author,
            timestamp,
            text: `Confidentiality rotating wrapped key epoch initialized by ${author.substring(0, 8)}...`
          });
        }
      }
      return systemItems;
    },

    // Roster management combining workspace membership & capabilities
    getChannelMembers() {
      const col = this.getCollection();
      const shell = this.getShell();
      const members = [];
      
      if (shell && shell.activeWorkspace) {
        for (const mId of shell.activeWorkspace.members) {
          const caps = col ? col.capabilities.get(mId) : null;
          members.push({
            id: mId,
            name: shell.contacts.find(c => c.id === mId)?.name || "Operator " + mId.substring(0, 6),
            capabilities: caps || (mId === shell.participant.id ? ["read", "write"] : ["read"])
          });
        }
      } else if (col) {
        for (const [mId, caps] of col.capabilities.entries()) {
          members.push({
            id: mId,
            name: "Operator " + mId.substring(0, 6),
            capabilities: caps
          });
        }
      }
      return members;
    },

    inspectDid(userId) {
      const didDocument = {
        "@context": [
          "https://www.w3.org/ns/did/v1",
          "https://w3id.org/security/suites/jws-2020/v1"
        ],
        "id": `did:key:${userId}`,
        "verificationMethod": [
          {
            "id": `did:key:${userId}#key-1`,
            "type": "JsonWebKey2020",
            "controller": `did:key:${userId}`,
            "publicKeyJwk": {
              "kty": "EC",
              "crv": "P-256",
              "x": userId.substring(2, 66),
              "y": userId.substring(66, 130)
            }
          }
        ],
        "authentication": [
          `did:key:${userId}#key-1`
        ],
        "assertionMethod": [
          `did:key:${userId}#key-1`
        ]
      };
      prompt(`W3C DID Core Document for key did:key:${userId.substring(0, 8)}...`, JSON.stringify(didDocument, null, 2));
    },

    // Replying and scroll tools
    setReply(msg) {
      this.replyingTo = msg;
      this.$nextTick(() => {
        const inputEl = this.$el.querySelector(".chat-input");
        if (inputEl) inputEl.focus();
      });
    },

    scrollToMessage(msgId) {
      const el = this.$el.querySelector(`#msg-${msgId}`);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("highlight-flash");
        setTimeout(() => {
          el.classList.remove("highlight-flash");
        }, 1500);
      }
    },

    scrollToBottom() {
      const scroller = this.$el.querySelector("#chat-scroller");
      if (scroller) scroller.scrollTop = scroller.scrollHeight;
    },

    // Attachments
    applyAttachment() {
      if (this.attachmentUrlInput) {
        this.attachedImageUrl = this.attachmentUrlInput.trim();
        this.attachmentUrlInput = "";
        this.showAttachmentInput = false;
      }
    },

    async send() {
      if (!this.text && !this.attachedImageUrl) return;
      const col = this.getCollection();
      if (!col) return;

      const shell = this.getShell();
      if (!shell) return;
      const p = shell.participant;
      const parents = Array.from(col.heads);
      
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const payload = {
        "@context": "https://www.w3.org/ns/activitystreams",
        "type": "Create",
        "object": {
          "type": "Note",
          "content": this.text,
          "published": new Date().toISOString()
        }
      };

      if (this.replyingTo) {
        payload.object.inReplyTo = this.replyingTo.id;
        payload.parentId = this.replyingTo.id; // fallback
      }

      if (this.attachedImageUrl) {
        payload.object.attachment = {
          "type": "Image",
          "url": this.attachedImageUrl
        };
        payload.attachment = payload.object.attachment; // fallback
      }

      // Runtime W3C Standards Conformance Check
      try {
        const { StandardsValidator } = await import(`${origin}${base}/assets/scripts/standards-validator.js`);
        StandardsValidator.validateActivityStreams(payload, "Create");
      } catch (err) {
        console.error("Standards Conformance Error:", err.message);
        alert(`Standards compliance check failed: ${err.message}`);
        return;
      }

      const ev = await Event.create({
        kind: "message",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload
      }, p);

      const added = await col.addEvent(ev);
      if (added) {
        this.saveEventOnShell(shell, ev);
        this.text = "";
        this.replyingTo = null;
        this.attachedImageUrl = "";
        
        await this.refresh();
        this.$nextTick(() => {
          this.scrollToBottom();
        });
      }
    },

    saveEventOnShell(shell, ev) {
      if (typeof shell.saveEvent === "function") {
        shell.saveEvent(ev);
      } else if (typeof shell.saveEventToStorage === "function") {
        shell.saveEventToStorage(ev);
      }
    },

    async toggleReact(msg, symbol) {
      const col = this.getCollection();
      if (!col) return;

      const shell = this.getShell();
      if (!shell) return;
      const p = shell.participant;
      const parents = Array.from(col.heads);
      
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const ev = await Event.create({
        kind: "reaction",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload: {
          "@context": "https://www.w3.org/ns/activitystreams",
          "type": "Like",
          "object": msg.id,
          "content": symbol
        }
      }, p);

      // Runtime W3C Standards Conformance Check
      try {
        const { StandardsValidator } = await import(`${origin}${base}/assets/scripts/standards-validator.js`);
        StandardsValidator.validateActivityStreams(ev.body.payload || ev.body.cleartext, "Like");
      } catch (err) {
        console.error("Standards Conformance Error on Reaction event:", err.message);
        return;
      }

      const added = await col.addEvent(ev);
      if (added) {
        this.saveEventOnShell(shell, ev);
        await this.refresh();
      }
    },

    startEdit(msg) {
      this.editing = msg;
      this.editText = msg.body;
    },

    async saveEdit() {
      if (!this.editing) return;
      const col = this.getCollection();
      if (!col) return;

      const shell = this.getShell();
      if (!shell) return;
      const p = shell.participant;
      const parents = Array.from(col.heads);
      
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const ev = await Event.create({
        kind: "edit",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload: {
          "@context": "https://www.w3.org/ns/activitystreams",
          "type": "Update",
          "object": {
            "type": "Note",
            "id": this.editing.id,
            "content": this.editText
          }
        }
      }, p);

      // Runtime W3C Standards Conformance Check
      try {
        const { StandardsValidator } = await import(`${origin}${base}/assets/scripts/standards-validator.js`);
        StandardsValidator.validateActivityStreams(ev.body.payload || ev.body.cleartext, "Update");
      } catch (err) {
        console.error("Standards Conformance Error on Edit event:", err.message);
        return;
      }

      const added = await col.addEvent(ev);
      if (added) {
        this.saveEventOnShell(shell, ev);
        await this.refresh();
        this.editing = null;
      }
    },

    async invite() {
      const col = this.getCollection();
      if (!col) return;

      const shell = this.getShell();
      if (!shell) return;
      const p = shell.participant;

      const savedContacts = JSON.parse(localStorage.getItem("holoapps_contacts") || "[]");
      let targetId = "";
      let targetCurveId = "";
      let selectedContact = null;
      
      const otherContacts = savedContacts.filter(c => c.id !== p.id);
      if (otherContacts.length > 0) {
        const choices = otherContacts.map((c, idx) => `${idx + 1}. ${c.name} (${c.id.substring(0, 8)}...)`).join("\n");
        const choice = prompt(`Select a contact to invite, or enter 'new':\n\n${choices}`);
        if (!choice) return;
        
        if (choice.trim().toLowerCase() !== "new") {
          const idx = parseInt(choice.trim()) - 1;
          if (idx >= 0 && idx < otherContacts.length) {
            selectedContact = otherContacts[idx];
            targetId = selectedContact.id;
            targetCurveId = selectedContact.curveId;
          }
        }
      }
      
      if (!selectedContact) {
        targetId = prompt("Enter Invitee's Identity Address (κ):");
        if (!targetId) return;
        targetCurveId = prompt("Enter Invitee's ECDH Public Exchange Key:");
        if (!targetCurveId) return;
      }

      const parents = Array.from(col.heads);
      let maxClock = 0;
      for (const pId of parents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > maxClock) maxClock = parent.header.clock;
      }

      const grantEvent = await Event.create({
        kind: "membership",
        author: p.id,
        collectionId: col.id,
        parents,
        clock: maxClock + 1,
        payload: {
          target: targetId,
          action: "grant",
          capabilities: ["read", "write"],
          curveId: targetCurveId
        }
      }, p);

      const grantAdded = await col.addEvent(grantEvent);
      if (!grantAdded) {
        alert("Failed to grant membership. Are you an admin of this channel?");
        return;
      }
      this.saveEventOnShell(shell, grantEvent);

      let epochKey = col.epochKeys.get(col.currentEpochId);
      if (!epochKey) {
        epochKey = await HoloAppsCrypto.generateEpochKey();
      }

      const myWrappedKey = await HoloAppsCrypto.wrapEpochKey(epochKey, p.curveKeys.privateKey, p.curveId);
      const targetWrappedKey = await HoloAppsCrypto.wrapEpochKey(epochKey, p.curveKeys.privateKey, targetCurveId);

      const epochParents = Array.from(col.heads);
      let epochMaxClock = 0;
      for (const pId of epochParents) {
        const parent = col.events.get(pId);
        if (parent && parent.header.clock > epochMaxClock) epochMaxClock = parent.header.clock;
      }

      const epochEvent = await Event.create({
        kind: "epoch",
        author: p.id,
        collectionId: col.id,
        parents: epochParents,
        clock: epochMaxClock + 1,
        payload: {
          senderCurveId: p.curveId,
          wrappedKeys: {
            [p.id]: myWrappedKey,
            [targetId]: targetWrappedKey
          }
        }
      }, p);

      const epochAdded = await col.addEvent(epochEvent);
      if (!epochAdded) {
        alert("Failed to add epoch key rotation event.");
        return;
      }
      this.saveEventOnShell(shell, epochEvent);
      col.epochKeys.set(epochEvent.id, epochKey);
      col.currentEpochId = epochEvent.id;

      const allEvents = Array.from(col.events.values()).map(ev => ({
        header: ev.header,
        body: ev.body,
        signature: ev.signature,
        id: ev.id
      }));

      const genesisEvent = allEvents.find(e => e.header.kind === "genesis");
      const ch = shell.channels.find(c => c.id === col.id);
      const channelName = ch ? ch.name : "Joined Channel";

      const inviteObj = {
        id: col.id,
        name: channelName,
        genesisEvent,
        events: allEvents.filter(e => e.header.kind !== "genesis")
      };

      const serialized = base64Encode(JSON.stringify(inviteObj));
      prompt("Share this Invite Code with the invitee:", serialized);
    }
  }
</script>
