<div class="wrapper" style="background: #111; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; flex-direction: column;">
  <img class="logo" src="assets/img/favicon.svg" style="width: 64px; height: 64px; margin-bottom: 24px; animation: pulse 2s infinite ease-in-out;" />
  <div style="font-family: inherit; font-size: 1.5rem; font-weight: 500;">Initializing Playground session...</div>
</div>

<style>
  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.5; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.5; }
  }
</style>

<script type="module">
  const origin = window.location.origin
  const base = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
  const { Participant } = await import(`${origin}${base}/assets/scripts/holo-apps.js`)

  export default {
    mixins: [],
    async init() {
      await this.localLogin()
    },
    async localLogin() {
      // 1. Generate keys if not present
      let savedJwk = localStorage.getItem("holoapps_participant_jwk")
      if (!savedJwk) {
        try {
          const p = await Participant.create()
          const jwk = await p.exportJwk()
          localStorage.setItem("holoapps_participant_jwk", JSON.stringify(jwk))
          localStorage.setItem("holoapps_identity_key", p.id)
          localStorage.setItem("holoapps_curve_key", p.curveId)
          console.log("Generated login-block identity:", p.id)
        } catch (e) {
          console.error("Failed to generate identity:", e)
          return
        }
      }

      // 2. Playwright session local storage sync (repo setup)
      const user = localStorage.getItem("user")
      if (!user) {
        const userHandle = await repo.create({
          worlds: [],
        })
        localStorage.setItem("user", userHandle.documentId)
      }

      await fetch("/api/auth/set-session", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_token: "local",
          refresh_token: "local",
          expires_at: "local",
        }),
      })

      setTimeout(() => {
        window.location.href = "worlds.html"
      }, 1000)
    }
  }
</script>
