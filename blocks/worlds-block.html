<div x-effect="getWorlds()" class="wrapper">
  <div
    :style="{
    position: 'absolute',
    top: '12px',
    right: '12px'
  }"
  >
    <user-block></user-block>
  </div>

  <img class="logo" src="assets/img/favicon.svg" />

  <flex-block
    :style="{ flexDirection: 'column', alignItems: 'center', fontSize: '4rem', color: 'white' }"
  >
    <h1>Welcome to Playground!</h1>
    <div class="grey">The collaborative web toolkit</div>
  </flex-block>

  <flex-block
    :style="{ gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }"
  >
    <template x-for="world in worlds">
      <div
        @click="location.href = './index.html?id=' + (world.slug || world.automerge_id)"
        class="world"
      >
        <div class="pane">
          <img src="assets/img/globe-alt.svg" />
        </div>
        <div
          class="title"
          x-text="(await repo.find(world.automerge_id)).doc().name || '???'"
        >
          ???
        </div>
      </div>
    </template>
  </flex-block>

  <flex-block>
    <button @click="createWorld()">Create a World</button>
  </flex-block>
</div>

<script type="module">
  export default {
    mixins: [],
    worlds: [],
    async getWorlds() {
      const data = await fetch("/api/worlds", {
        headers: new Headers({
          accept: "application/json",
        }),
        credentials: "include",
      }).then((resp) => resp.json())

      const user = localStorage.getItem("user")
      let userHandle

      if (user) {
        userHandle = await repo.find(user)
      }

      this.worlds = data.map((w) => ({
        automerge_id: w.automerge_id,
        slug: w.slug,
      }))

      if (userHandle) {
        this.worlds = this.worlds.concat(
          userHandle.doc().worlds.map((w) => ({
            automerge_id: w,
          })),
        )
      }
    },
    async createWorld() {
      const user = localStorage.getItem("user")
      const userHandle = await repo.find(user)

      const worldHandle = repo.create()
      worldHandle.change((doc) => {
        doc.packages = []
        doc.theme = "night"
        doc.font = "Nanum Pen Script"
        doc.world = []
      })

      userHandle.change((doc) => {
        doc.worlds.push(worldHandle.documentId)
      })

      await fetch("/api/worlds", {
        method: "POST",
        credentials: "include",
        headers: new Headers({
          accept: "application/json",
        }),
        body: JSON.stringify({
          id: worldHandle.documentId,
        }),
      })

      await new Promise(r => setTimeout(r, 500)); await this.getWorlds()
    },
  }
</script>
