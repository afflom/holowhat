<script type="module">
  export default {
    mixins: [],
    theme: "",
    init() {
      this.$nextTick(this.loadParticles.bind(this))
      this.$nextTick(this.updateFont.bind(this))
      this.$watch("doc.font", this.updateFont.bind(this))
      this.$watch("doc.theme", this.loadParticles.bind(this))
    },
    updateFont() {
      if (!this.doc.font || this.doc.font === this.currentFont) return
      this.currentFont = this.doc.font

      // If doc.font is "Space Grotesk:ital,wght@0,400;1,700"
      // use only the family name for CSS
      const familyName = this.doc.font.split(":")[0]

      WebFont.load({
        google: { families: [this.doc.font] },
        active: () => {
          let styleEl = document.querySelector("style[data-global-font]")
          if (!styleEl) {
            styleEl = document.createElement("style")
            styleEl.setAttribute("data-global-font", "true")
            document.head.appendChild(styleEl)
          }

          styleEl.textContent =
            `*,*::before,*::after{` +
            `font-family:'${familyName}',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;` +
            `}`
        },
      })
    },
    loadParticles() {
      if (this.theme === this.doc.theme) return

      this.theme = this.doc.theme
      if (this.doc.theme === "turf" || this.doc.theme === "lotr") {
        particlesJS.clear.call(this.$el, "space")
        return
      }

      particlesJS.load.call(
        this.$el,
        "space",
        `/assets/scripts/particle-presets/${this.doc.theme || "bubble"}.json`,
      )
    },
  }
</script>

<template x-if="doc.theme === 'lotr'">
  <style>
    .space {
      background-image: url("/assets/img/lotr.webp");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      box-shadow:
        0 0 80px 20px #2c2e43,
        0 0 200px 60px #2c2e43;
    }
  </style>
</template>

<template x-if="doc.theme === 'bubble'">
  <style>
    .space {
      background-color: #2c2e43;
      box-shadow:
        0 0 80px 20px #2c2e43,
        0 0 200px 60px #2c2e43;
    }
  </style>
</template>

<template x-if="doc.theme === 'snow'">
  <style>
    .space {
      background-color: var(--red);
      box-shadow:
        0 0 80px 20px var(--red),
        0 0 200px 60px var(--red);
    }
  </style>
</template>

<template x-if="doc.theme === 'night'">
  <style>
    .space {
      background-color: #232741;
      box-shadow:
        0 0 80px 20px #232741,
        0 0 200px 60px #232741;
    }
  </style>
</template>

<template x-if="doc.theme === 'turf'">
  <style>
    .space {
      background-image: url("/assets/img/turf.jpg");
      background-repeat: repeat;
      background-size: 1060px 398px; /* adjust for tile size */
      background-position: 0 0;
      box-shadow:
        0 0 80px 20px #232741,
        0 0 200px 60px #232741;
    }
  </style>
</template>
