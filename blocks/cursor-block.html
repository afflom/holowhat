<style>
  :host {
    position: absolute;
    display: block;
    top: 0;
    left: 0;
  }
  div {
    display: flex;
    flex-direction: column;
  }
</style>

<div
  @peer-mousemove.window="positionUpdated"
  :style="{ transform: `translate(${mouseX}px, ${mouseY}px)`}"
>
  <svg width="24" height="24" viewBox="0 0 24 24">
    <path
      transform="rotate(-30, 12, 12)"
      fill="#F15156"
      stroke="#FFFFFF"
      stroke-width="1.25"
      d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87a.5.5 0 0 0 .35-.85L6.35 2.85a.5.5 0 0 0-.85.35Z"
    />
  </svg>
  <div
    :style="{
    background: '#F15156',
    color: 'white',
    padding: '0px 8px',
    borderRadius: '4px',
    marginTop: '4px',
    marginLeft: '8px',
  }"
    x-text="props.peer.split('-')[0]"
  ></div>
</div>

<script type="module">
  export default {
    mixins: ["@playground/block-mixin"],
    mouseX: 0,
    mouseY: 0,
    positionUpdated(event) {
      const { senderId, mouseX, mouseY } = event.detail
      if (senderId !== this.props.peer) return

      this.mouseX = mouseX
      this.mouseY = mouseY

      clearTimeout(this.timeoutId)
      this.timeoutId = setTimeout(() => {
        this.$host.remove()
      }, 3000)
    },
  }
</script>
